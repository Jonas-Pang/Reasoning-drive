  section: 210(2)
  page: 193
  marking_type: specified-angle parking marking
  element: area
  text_original: 'If the parking control sign or road marking indicates that the vehicle must be positioned at a specified
    angle (other than 90), the driver must position the vehicle:

    (a) so that the vehicle is at an angle as near as practicable to the specified angle; and

    (b) if the vehicle is parked on the side of the road—with the rear of the vehicle nearest to the centre of the road.'
