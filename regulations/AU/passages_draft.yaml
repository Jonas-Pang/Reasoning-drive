- rule_id: AU-146(1)
  region: AU
  source: Australian Road Rules (national model law), version of 9 June 2023
  section: 146(1)
  page: 135
  marking_type: marked lane
  element: lane_type
  text_original: 'A driver on a multi-lane road must drive so the driver’s vehicle is completely in a marked lane, unless
    the driver is:

    (a) entering a part of the road of one kind from a part of the road of another kind (for example, moving to or from a
    service road or a shoulder of the road); or

    (b) entering or leaving the road; or

    (c) moving from one marked lane to another marked lane; or

    (d) avoiding an obstruction; or

    (e) obeying a traffic control device applying to the marked lane; or

    (ea) lane filtering in accordance with rule 151A; or

    (f) permitted to drive in more than one marked lane under another provision of the Australian Road Rules or under another
    law of this jurisdiction.'
  text_en: 'A driver on a multi-lane road must drive so the driver’s vehicle is completely in a marked lane, unless the driver
    is:

    (a) entering a part of the road of one kind from a part of the road of another kind (for example, moving to or from a
    service road or a shoulder of the road); or

    (b) entering or leaving the road; or

    (c) moving from one marked lane to another marked lane; or

    (d) avoiding an obstruction; or

    (e) obeying a traffic control device applying to the marked lane; or

    (ea) lane filtering in accordance with rule 151A; or

    (f) permitted to drive in more than one marked lane under another provision of the Australian Road Rules or under another
    law of this jurisdiction.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
  verified_quote: true
  norm_check: agrees
