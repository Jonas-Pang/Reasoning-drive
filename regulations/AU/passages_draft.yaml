    (a) beginning at a bicycle lane sign applying to the lane, or a road marking comprising both a white bicycle symbol and
    the word lane painted in white; and

    (b) ending at the nearest of the following:

    (i) an end bicycle lane sign applying to the lane, or a road marking comprising both a white bicycle symbol and the words
    end lane painted in white;

    (ii) an intersection (unless the lane is at the unbroken side of the continuing road at a T–intersection or continued
    across the intersection by broken lines);

    (iii) if the road ends at a dead end—the end of the road.'
