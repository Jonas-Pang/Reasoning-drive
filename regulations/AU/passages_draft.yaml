- rule_id: AU-57(1)
  region: AU
  source: Australian Road Rules (national model law), version of 9 June 2023
  section: 57 (1)
  page: 54
  marking_type: stop line at traffic lights
  element: transverse
  text_original: 'A driver approaching or at traffic lights showing a yellow traffic light must stop:

    (a) if there is a stop line at or near the traffic lights and the driver can stop safely before reaching the stop line—as
    near as practicable to, but before reaching, the stop line; or

    (b) if there is no stop line at or near the traffic lights and the driver can stop safely before reaching the traffic
    lights—as near as practicable to, but before reaching, the nearest or only traffic lights; or

    (c) if the traffic lights are at an intersection and the driver cannot stop safely in accordance with paragraph (a) or
    (b), but can stop safely before entering the intersection—before entering the intersection;

    and must not proceed past the stop line or nearest or only traffic lights, or into the intersection (as the case may be),
    until the traffic lights show a green or flashing yellow traffic light or no traffic light.'
  text_en: 'A driver approaching or at traffic lights showing a yellow traffic light must stop:

    (a) if there is a stop line at or near the traffic lights and the driver can stop safely before reaching the stop line—as
    near as practicable to, but before reaching, the stop line; or

    (b) if there is no stop line at or near the traffic lights and the driver can stop safely before reaching the traffic
    lights—as near as practicable to, but before reaching, the nearest or only traffic lights; or

    (c) if the traffic lights are at an intersection and the driver cannot stop safely in accordance with paragraph (a) or
    (b), but can stop safely before entering the intersection—before entering the intersection;

    and must not proceed past the stop line or nearest or only traffic lights, or into the intersection (as the case may be),
    until the traffic lights show a green or flashing yellow traffic light or no traffic light.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
  verified_quote: true
  norm_check: agrees
