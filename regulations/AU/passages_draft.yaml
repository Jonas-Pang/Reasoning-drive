- rule_id: AU-138(2)
  region: AU
  source: Australian Road Rules (national model law), version of 9 June 2023
  section: 138 (2)
  page: 130
  marking_type: single continuous painted-island boundary
  element: boundary
  text_original: 'A driver may drive on or over a single continuous line along the side of or surrounding a painted island
    for up to 50 metres:

    (a) to enter or leave the road; or

    (b) to enter a turning lane that begins immediately after the painted island; or

    (c) to enter a part of the road of one kind from a part of the road of another kind (for example, moving to or from a
    service road or emergency stopping lane); or

    (d) to park in angle parking on the opposite side of the road provided that the driver does not need to perform a U-turn
    to reach the parking area.'
  text_en: 'A driver may drive on or over a single continuous line along the side of or surrounding a painted island for up
    to 50 metres:

    (a) to enter or leave the road; or

    (b) to enter a turning lane that begins immediately after the painted island; or

    (c) to enter a part of the road of one kind from a part of the road of another kind (for example, moving to or from a
    service road or emergency stopping lane); or

    (d) to park in angle parking on the opposite side of the road provided that the driver does not need to perform a U-turn
    to reach the parking area.'
  text_en_is_translation: false
  norm: permissive
  actions_stated:
    cross_line: allowed
  verified_quote: true
  norm_check: agrees
- rule_id: AU-138(3)
  region: AU
  source: Australian Road Rules (national model law), version of 9 June 2023
  section: 138 (3)
  page: 130
  marking_type: painted island at a merge or slip lane
  element: area
  text_original: 'Subrule (2) (a) does not apply in the case of a painted island:

    (a) that separates a road that takes vehicles in one direction from another road that takes vehicles in the same direction
    at a place where the roads merge; or

    (b) that separates one part of a road from other parts of the road to create a slip lane.'
