  source: Australian Road Rules (national model law), version of 9 June 2023
  section: '121'
  page: 115
  marking_type: stop line at level crossing
  element: transverse
  text_original: 'A driver at a level crossing with a stop sign must:

    (a) stop as near as practicable to, but before reaching, the stop line or, if there is no stop line, as near as practicable
    to, but before reaching, the stop sign; and

    (b) give way to any train or tram on, approaching or entering the crossing.'
  text_en: 'A driver at a level crossing with a stop sign must:

    (a) stop as near as practicable to, but before reaching, the stop line or, if there is no stop line, as near as practicable
    to, but before reaching, the stop sign; and

    (b) give way to any train or tram on, approaching or entering the crossing.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
