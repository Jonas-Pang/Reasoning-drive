  source: Australian Road Rules (national model law), version of 9 June 2023
  section: 137 (2)
  page: 129
  marking_type: continuous-line-bounded dividing strip
  element: area
  text_original: 'A driver may drive on a dividing strip that is at the same level as the road, and marked at each side by
    a continuous line:

    (a) to enter or leave the road; or

    (b) to enter or leave an area on the dividing strip to which a parking control sign applies if the driver is permitted
    to park in the area.'
