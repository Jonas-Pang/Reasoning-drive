- rule_id: AU-134(2)
  region: AU
  source: Australian Road Rules (national model law), version of 9 June 2023
  section: 134 (2)
  page: 125
  marking_type: broken dividing lines or broken line with continuous line on right
  element: boundary
  text_original: 'If the dividing line is a single broken dividing line only, or a broken dividing line to the left of a single
    continuous dividing line, or 2 parallel broken dividing lines, the driver may drive to the right of the dividing line:

    (a) to overtake another driver; or

    (b) to perform a U-turn, unless another rule would prohibit the driver performing the U-turn.'
  text_en: 'If the dividing line is a single broken dividing line only, or a broken dividing line to the left of a single
    continuous dividing line, or 2 parallel broken dividing lines, the driver may drive to the right of the dividing line:

    (a) to overtake another driver; or

    (b) to perform a U-turn, unless another rule would prohibit the driver performing the U-turn.'
  text_en_is_translation: false
  norm: permissive
  actions_stated:
    cross_line: allowed
    u_turn: allowed
  verified_quote: true
  norm_check: agrees
- rule_id: AU-134(3)
  region: AU
  source: Australian Road Rules (national model law), version of 9 June 2023
  section: 134 (3)
  page: 125
  marking_type: single, mixed continuous-and-broken, or double broken dividing lines
  element: boundary
  text_original: 'If the dividing line is a single continuous or broken dividing line, or a broken dividing line to the left
    or right of a single continuous dividing line, or 2 parallel broken dividing lines, the driver may drive to the right
    of the dividing line:

    (a) to enter or leave the road; or

    (b) to enter a part of the road of one kind from a part of the road of another kind (for example, moving to or from a
    service road or emergency stopping lane); or

    (c) to park in angle parking on the opposite side of the road provided that the driver does not need to perform a U-turn
    to reach the parking area.'
  text_en: 'If the dividing line is a single continuous or broken dividing line, or a broken dividing line to the left or
    right of a single continuous dividing line, or 2 parallel broken dividing lines, the driver may drive to the right of
    the dividing line:

    (a) to enter or leave the road; or

    (b) to enter a part of the road of one kind from a part of the road of another kind (for example, moving to or from a
    service road or emergency stopping lane); or

    (c) to park in angle parking on the opposite side of the road provided that the driver does not need to perform a U-turn
    to reach the parking area.'
  text_en_is_translation: false
  norm: permissive
  actions_stated:
    cross_line: allowed
    u_turn: prohibited
  verified_quote: true
  norm_check: agrees
