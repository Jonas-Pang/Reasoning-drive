- rule_id: AU-247A(1)–(2)
  region: AU
  source: Australian Road Rules (national model law), version of 9 June 2023
  section: 247A (1)–(2)
  page: 232
  marking_type: bicycle storage area
  element: area
  text_original: '(1) A rider of a bicycle approaching a bicycle storage area at an intersection that has traffic lights or
    traffic arrows showing a red traffic light or red arrow must not enter the bicycle storage area other than from a bicycle
    lane, unless the rider is not required to ride in the bicycle lane under the Australian Road Rules.

    (2) Subrule (1) does not apply if:

    (a) the bicycle storage area cannot, under another law of this jurisdiction, be entered from a bicycle lane; and

    (b) the rider enters the area in accordance with another law of this jurisdiction.'
  text_en: '(1) A rider of a bicycle approaching a bicycle storage area at an intersection that has traffic lights or traffic
    arrows showing a red traffic light or red arrow must not enter the bicycle storage area other than from a bicycle lane,
    unless the rider is not required to ride in the bicycle lane under the Australian Road Rules.

    (2) Subrule (1) does not apply if:

    (a) the bicycle storage area cannot, under another law of this jurisdiction, be entered from a bicycle lane; and

    (b) the rider enters the area in accordance with another law of this jurisdiction.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    enter_waiting_area: prohibited
  verified_quote: true
  norm_check: agrees
- rule_id: AU-247B(1)
  region: AU
  source: Australian Road Rules (national model law), version of 9 June 2023
  section: 247B (1)
  page: 232
  marking_type: bicycle storage area
  element: area
  text_original: 'A rider of a bicycle must when entering a bicycle storage area, give way to:

    (a) any vehicle that is in the area; and

    (b) if the area is before any green or yellow traffic lights, any motor vehicle that is entering or about to enter the
    area, unless the motor vehicle is turning in a direction that is subject to a red traffic arrow; and

    (c) if the area forms part of a lane to which traffic arrows apply, any motor vehicle that is entering or about to enter
    the area at a time when those arrows are green or yellow.'
  text_en: 'A rider of a bicycle must when entering a bicycle storage area, give way to:

    (a) any vehicle that is in the area; and

    (b) if the area is before any green or yellow traffic lights, any motor vehicle that is entering or about to enter the
    area, unless the motor vehicle is turning in a direction that is subject to a red traffic arrow; and

    (c) if the area forms part of a lane to which traffic arrows apply, any motor vehicle that is entering or about to enter
    the area at a time when those arrows are green or yellow.'
  text_en_is_translation: false
  norm: mandatory
