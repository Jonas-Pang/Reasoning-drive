# Australia (AU). The Australian Road Rules are the national model law; each state and territory makes them law with its own changes (regions AU-NSW ... AU-NT, parent: AU).
# Documents are downloaded and read by:
#   python main.py regulations fetch AU
#   python main.py regulations extract-all AU --real
#   python main.py regulations accept AU        (after reading passages_draft.yaml)

code: AU
name: "Australia"
name_zh: "澳大利亚"
driving_side: left
status: draft                   # planned -> draft (extracted) -> in use (accepted)

standard:
  title: "Australian Road Rules (national model law), version of 9 June 2023"
  language: en
  source_url: https://pcc.gov.au/uniform/Australian-Road-Rules-9June2023.pdf
  source_pdf: regulations/inbox/AU/australian_road_rules_2023-06-09.pdf
  licence: "not checked yet: see the register's copyright page"

documents:
  - tag: arr
    title: "Australian Road Rules (national model law), version of 9 June 2023"
    urls:
      - {url: "https://pcc.gov.au/uniform/Australian-Road-Rules-9June2023.pdf", type: pdf}
    file: regulations/inbox/AU/australian_road_rules_2023-06-09.pdf
    keywords: ["dividing line", "lane line", "marked lane", "turn line", "traffic lane arrow", "lane arrow", "edge line", "painted island", "continuous line", "broken line", "keep clear", "stop line", "give way line", "hook turn", "transit lane", "bus lane", "tram lane", "truck lane", "bicycle lane", "special purpose lane", "changing lanes", "change lanes", "turning lane", "slip lane", "median strip", "line of traffic", "merge", "overtak", "keep left", "u-turn"]
    min_hits: 2

passages:
  marking: passages_lane.yaml
  lane: [passages_lane.yaml]

rule_tables:
  marking: action_rules.json
  lane: lane_action_rules.json
