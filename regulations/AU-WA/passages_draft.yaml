- rule_id: AU-WA-46(3)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 46(3)
  page: 115
  marking_type: stop line at non-functioning traffic signals
  element: transverse
  text_original: 'Despite subregulations (1) and (2), a driver may only proceed beyond the stop line associated with traffic-control
    signals facing a driver that do not appear to be functioning, or display flashing yellow signals, or (in the absence of
    a stop line) beyond a point adjacent to the nearest signals, if the driver —

    (b) does not turn the vehicle contrary to an instruction on a traffic sign at the intersection; and

    (d) complies with any direction by a police officer, if a police officer is in attendance regulating traffic.'
  text_en: 'Despite subregulations (1) and (2), a driver may only proceed beyond the stop line associated with traffic-control
    signals facing a driver that do not appear to be functioning, or display flashing yellow signals, or (in the absence of
    a stop line) beyond a point adjacent to the nearest signals, if the driver —

    (b) does not turn the vehicle contrary to an instruction on a traffic sign at the intersection; and

    (d) complies with any direction by a police officer, if a police officer is in attendance regulating traffic.'
  text_en_is_translation: false
