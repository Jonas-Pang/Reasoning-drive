- rule_id: AU-WA-165
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: '165'
  page: 246
  marking_type: painted island
  element: area
  text_original: 'The driver of a vehicle (other than a bicycle, an electric rideable device, an EPT or an animal) must not
    stop so that any portion of the vehicle is on a path, dividing strip, painted island, or a nature strip adjacent to a
    length of carriageway in a built-up area, unless —

    (a) the driver stops in an area, to which a parking control sign applies and the driver is permitted to stop at that place
    under these regulations; or'
  text_en: 'The driver of a vehicle (other than a bicycle, an electric rideable device, an EPT or an animal) must not stop
    so that any portion of the vehicle is on a path, dividing strip, painted island, or a nature strip adjacent to a length
    of carriageway in a built-up area, unless —

    (a) the driver stops in an area, to which a parking control sign applies and the driver is permitted to stop at that place
    under these regulations; or'
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-170
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: '170'
  page: 250
  marking_type: M/C motorcycle parking marking
  element: area
  text_original: 'The driver of a vehicle must not stop on a length of carriageway, or in an area, to which a “motor cycle
    parking” sign applies, or an area marked “M/C”, unless —

    (a) the vehicle is a motor cycle; or

    (b) the driver is dropping off, or picking up, passengers.'
