  section: 61(3)
  page: 140
  marking_type: children’s crossing
  element: transverse
  text_original: A driver must not enter upon, or attempt to cross, a children’s crossing if the carriageway beyond it is
    blocked.
  text_en: A driver must not enter upon, or attempt to cross, a children’s crossing if the carriageway beyond it is blocked.
