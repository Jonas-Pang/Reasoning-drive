- rule_id: AU-WA-145(1)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 145(1)
  page: 230
  marking_type: marked foot crossing
  element: transverse
  text_original: A driver must not stop on a marked foot crossing that is not at an intersection, or on the carriageway within
    10 m before the traffic-control signal pole nearest to the driver at the marked foot crossing and 3 m after the marked
    foot crossing, unless the person stops the vehicle at a place on a length of carriageway, or in an area, to which a parking
    control sign applies and the person is permitted to stop at that place under these regulations.
  text_en: A driver must not stop on a marked foot crossing that is not at an intersection, or on the carriageway within 10
    m before the traffic-control signal pole nearest to the driver at the marked foot crossing and 3 m after the marked foot
    crossing, unless the person stops the vehicle at a place on a length of carriageway, or in an area, to which a parking
    control sign applies and the person is permitted to stop at that place under these regulations.
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
