- rule_id: AU-WA-218(2)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 218(2)
  page: 299
  marking_type: no bicycles road marking
  element: lane_marking
  text_original: 'A “no bicycles” sign, or a “no bicycles” road marking, applies to a length of carriageway or path beginning
    at the sign or marking and ending at the nearest of the following:

    (a) a “bicycle path” sign or “bicycle path” road marking;

    (b) a “bicycle lane” sign;

    (c) a “separated footpath” sign or “separated footpath” road marking;

    (d) a “shared path” sign;

    (e) an “end no bicycles” sign;

    (f) the next intersection.'
  text_en: 'A “no bicycles” sign, or a “no bicycles” road marking, applies to a length of carriageway or path beginning at
    the sign or marking and ending at the nearest of the following:

    (a) a “bicycle path” sign or “bicycle path” road marking;

    (b) a “bicycle lane” sign;

    (c) a “separated footpath” sign or “separated footpath” road marking;

    (d) a “shared path” sign;

    (e) an “end no bicycles” sign;

    (f) the next intersection.'
  text_en_is_translation: false
  norm: informative
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
