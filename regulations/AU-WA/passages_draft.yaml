- rule_id: AU-WA-124A(5)(b)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 124A(5)(b)
  page: 200
  marking_type: dividing line
  element: boundary
  text_original: 'A driver of a motor vehicle may, if it is necessary in order to comply with subregulation (1), do any of
    the following —

    (b) if the driver is driving on a two-way carriageway with a dividing line — drive to the right of the dividing line,
    provided that the driver has a clear view of any approaching traffic and can do so safely;'
  text_en: 'A driver of a motor vehicle may, if it is necessary in order to comply with subregulation (1), do any of the following
    —

    (b) if the driver is driving on a two-way carriageway with a dividing line — drive to the right of the dividing line,
    provided that the driver has a clear view of any approaching traffic and can do so safely;'
  text_en_is_translation: false
