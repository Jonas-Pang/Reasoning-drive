- rule_id: AU-WA-136(1)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 136(1)
  page: 217
  marking_type: bicycle, bus, transit or truck lane
  element: lane_type
  text_original: 'The driver of any vehicle may drive for up to the permitted distance in a bicycle lane, bus lane, transit
    lane or truck lane if it is necessary for the driver to drive in the lane —

    (a) to enter or leave the carriageway; or

    (b) to enter a part of the carriageway of one kind from a part of the carriageway of another kind (for example, moving
    to or from a service road, an emergency stopping bay or an emergency stopping lane); or

    (c) to overtake a vehicle that is turning right, or making a U turn from the centre of the road, and is giving a right
    turn signal; or

    (d) to enter a marked lane, or a line of traffic, from the side of the carriageway.'
  text_en: 'The driver of any vehicle may drive for up to the permitted distance in a bicycle lane, bus lane, transit lane
    or truck lane if it is necessary for the driver to drive in the lane —

    (a) to enter or leave the carriageway; or

    (b) to enter a part of the carriageway of one kind from a part of the carriageway of another kind (for example, moving
    to or from a service road, an emergency stopping bay or an emergency stopping lane); or

    (c) to overtake a vehicle that is turning right, or making a U turn from the centre of the road, and is giving a right
    turn signal; or

    (d) to enter a marked lane, or a line of traffic, from the side of the carriageway.'
  text_en_is_translation: false
  norm: permissive
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-136(2)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 136(2)
  page: 217
  marking_type: bicycle, bus, transit or truck lane
  element: lane_type
  text_original: 'The driver of any vehicle may drive in a bicycle lane, bus lane, transit lane or truck lane if —

    (a) it is necessary for the driver to drive in the lane to avoid an obstruction; or

    (b) information on or with a traffic sign applying to the lane indicates that the driver may drive in the lane.'
  text_en: 'The driver of any vehicle may drive in a bicycle lane, bus lane, transit lane or truck lane if —

    (a) it is necessary for the driver to drive in the lane to avoid an obstruction; or

    (b) information on or with a traffic sign applying to the lane indicates that the driver may drive in the lane.'
  text_en_is_translation: false
  norm: permissive
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
