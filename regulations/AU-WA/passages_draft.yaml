- rule_id: AU-WA-62(5)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 62(5)
  page: 142
  marking_type: pedestrian crossing
  element: transverse
  text_original: 'Despite subregulation (4), a driver may enter upon or attempt to cross a pedestrian crossing if —

    (a) the pedestrian crossing is immediately before an intersection that is not controlled by traffic lights; and

    (b) the pedestrian crossing is not blocked; and

    (c) the driver gives way to any pedestrian or relevant rider on the pedestrian crossing at the time the driver enters
    upon or attempts to cross the pedestrian crossing.'
  text_en: 'Despite subregulation (4), a driver may enter upon or attempt to cross a pedestrian crossing if —

    (a) the pedestrian crossing is immediately before an intersection that is not controlled by traffic lights; and

    (b) the pedestrian crossing is not blocked; and

    (c) the driver gives way to any pedestrian or relevant rider on the pedestrian crossing at the time the driver enters
    upon or attempts to cross the pedestrian crossing.'
