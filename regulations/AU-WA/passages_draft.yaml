  section: 124A(5)(c)
  page: 200
  marking_type: single or double continuous line and painted island
  element: general
  text_original: 'A driver of a motor vehicle may, if it is necessary in order to comply with subregulation (1), do any of
    the following —

    (c) drive on a dividing strip, or on or over a single continuous line or 2 parallel continuous lines, or on or over a
    painted island, provided that the driver has a clear view of any approaching traffic and can do so safely.'
  text_en: 'A driver of a motor vehicle may, if it is necessary in order to comply with subregulation (1), do any of the following
    —

    (c) drive on a dividing strip, or on or over a single continuous line or 2 parallel continuous lines, or on or over a
