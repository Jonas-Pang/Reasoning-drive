  section: 22(3)
  page: 81
  marking_type: left-turn guide line
  element: boundary
  text_original: 'A driver may turn left at an intersection in a manner other than that indicated by a turn line if —

    (a) the driver’s vehicle or combination, together with any load or projection, is 7.5 m long, or longer; and

    (b) the rearmost part of the vehicle (or of the combination, if that is the case) displays a “do not overtake turning
    vehicle” sign; and

    (c) it is not practicable for the driver to turn left in the manner indicated by the turn line; and

    (d) the driver can safely turn left other than by the manner indicated by the turn line.'
  text_en: 'A driver may turn left at an intersection in a manner other than that indicated by a turn line if —

    (a) the driver’s vehicle or combination, together with any load or projection, is 7.5 m long, or longer; and

    (b) the rearmost part of the vehicle (or of the combination, if that is the case) displays a “do not overtake turning
    vehicle” sign; and

    (c) it is not practicable for the driver to turn left in the manner indicated by the turn line; and

    (d) the driver can safely turn left other than by the manner indicated by the turn line.'
  text_en_is_translation: false
