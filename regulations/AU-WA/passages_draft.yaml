- rule_id: AU-WA-126(1),(1A)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 126(1), (1A)
  page: 201
  marking_type: marked lane
  element: lane_type
  text_original: 'A driver must drive the vehicle as nearly as practicable entirely within a single marked lane or in a single
    line of traffic and must not move laterally from any such lane or line of traffic until he or she can do so with safety.

    Subregulation (1) does not apply if the driver is the rider of a motor cycle who is lane filtering in accordance with
    regulation 130B.'
  text_en: 'A driver must drive the vehicle as nearly as practicable entirely within a single marked lane or in a single line
    of traffic and must not move laterally from any such lane or line of traffic until he or she can do so with safety.

    Subregulation (1) does not apply if the driver is the rider of a motor cycle who is lane filtering in accordance with
    regulation 130B.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-126(2)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 126(2)
  page: 201
  marking_type: marked lane
  element: lane_type
  text_original: A driver who is moving laterally from any single marked lane (whether or not the lane is ending) or line
    of traffic must give way to any vehicle travelling in the same direction as the driver in the marked lane or line of traffic
    into which the driver is moving.
  text_en: A driver who is moving laterally from any single marked lane (whether or not the lane is ending) or line of traffic
    must give way to any vehicle travelling in the same direction as the driver in the marked lane or line of traffic into
    which the driver is moving.
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-127(1)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 127(1)
  page: 203
  marking_type: single continuous lane separation line
  element: boundary
  text_original: Where a portion of a road is divided longitudinally by single, continuous lines, into 2 or more lanes, a
    person must not drive a vehicle across any of those lines.
  text_en: Where a portion of a road is divided longitudinally by single, continuous lines, into 2 or more lanes, a person
    must not drive a vehicle across any of those lines.
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-127(2)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 127(2)
  page: 203
  marking_type: single continuous lane separation line
  element: boundary
  text_original: 'The provisions of subregulation (1) do not apply to a driver intending to make a left turn or a right turn,
    if —

    (a) the driver’s vehicle or combination, together with any load or projection, is 7.5 m long, or longer; and

    (b) the rearmost part of the vehicle (or of the combination, if that is the case) displays a “do not overtake turning
    vehicle” sign; and

    (c) any part of the vehicle is within 50 m of the nearest point of the intersection; and

    (d) (where a driver intends to turn right) it is not practicable for the driver to turn right from within the right lane;
    and

    (e) (where a driver intends to turn left) it is not practicable for the driver to turn left from within the left lane;
    and

    (f) the driver can safely occupy the next marked lane and can safely turn at the intersection by occupying the next marked
    lane, or both lanes.'
  text_en: 'The provisions of subregulation (1) do not apply to a driver intending to make a left turn or a right turn, if
    —

    (a) the driver’s vehicle or combination, together with any load or projection, is 7.5 m long, or longer; and

    (b) the rearmost part of the vehicle (or of the combination, if that is the case) displays a “do not overtake turning
    vehicle” sign; and

    (c) any part of the vehicle is within 50 m of the nearest point of the intersection; and

    (d) (where a driver intends to turn right) it is not practicable for the driver to turn right from within the right lane;
    and

    (e) (where a driver intends to turn left) it is not practicable for the driver to turn left from within the left lane;
    and

    (f) the driver can safely occupy the next marked lane and can safely turn at the intersection by occupying the next marked
    lane, or both lanes.'
  text_en_is_translation: false
  norm: permissive
  actions_stated:
    cross_line: allowed
    turn_left: allowed
    turn_right: allowed
  verified_quote: true
  norm_check: words say informative
- rule_id: AU-WA-127(3)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 127(3)
  page: 204
  marking_type: continuous lane separation line
  element: boundary
  text_original: 'The provisions of subregulation (1) do not apply to a driver on a multi-lane carriageway with a continuous
    line separating the lanes if —

    (a) the driver is avoiding an obstruction; or

    (aa) the driver is driving a motor vehicle and is passing a rideable device (as defined in regulation 124A(1A)) in accordance
    with regulation 124A(5); or

    (b) the driver is obeying a traffic-control signal applying to the first marked lane; or

    (ba) the driver is the rider of a motor cycle who is lane filtering in accordance with regulation 130B; or

    (c) either of the marked lanes is a special purpose lane in which the driver is permitted to drive and the driver is moving
    to or from the special purpose lane.'
  text_en: 'The provisions of subregulation (1) do not apply to a driver on a multi-lane carriageway with a continuous line
    separating the lanes if —

    (a) the driver is avoiding an obstruction; or

    (aa) the driver is driving a motor vehicle and is passing a rideable device (as defined in regulation 124A(1A)) in accordance
    with regulation 124A(5); or

    (b) the driver is obeying a traffic-control signal applying to the first marked lane; or

    (ba) the driver is the rider of a motor cycle who is lane filtering in accordance with regulation 130B; or

    (c) either of the marked lanes is a special purpose lane in which the driver is permitted to drive and the driver is moving
    to or from the special purpose lane.'
  text_en_is_translation: false
  norm: permissive
  actions_stated:
    cross_line: allowed
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-129(1)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 129(1)
  page: 205
  marking_type: continuous white edge line
  element: boundary
  text_original: A driver must not drive on or over a continuous white edge line on a carriageway unless subregulation (2)
    or (3) applies to the driver.
  text_en: A driver must not drive on or over a continuous white edge line on a carriageway unless subregulation (2) or (3)
    applies to the driver.
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-129(2)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 129(2)
  page: 205
  marking_type: continuous white edge line
  element: boundary
  text_original: 'A driver may drive on or over a continuous white edge line on a carriageway if the driver is —

    (a) overtaking a vehicle that is turning right, or making a U turn from the centre of the road, and is giving a right
    change of direction signal; or

    (b) driving a slow-moving vehicle, and it is necessary for the driver to drive on or over the edge line to allow the vehicle
    to be overtaken or passed by another vehicle; or

    (c) driving a vehicle that is too wide, or too long, to drive on the carriageway without driving on or over the edge line;
    or

    (d) permitted to drive on or over the edge line under another written law of the State; or

    (e) avoiding an obstruction.'
  text_en: 'A driver may drive on or over a continuous white edge line on a carriageway if the driver is —

    (a) overtaking a vehicle that is turning right, or making a U turn from the centre of the road, and is giving a right
    change of direction signal; or

    (b) driving a slow-moving vehicle, and it is necessary for the driver to drive on or over the edge line to allow the vehicle
    to be overtaken or passed by another vehicle; or

    (c) driving a vehicle that is too wide, or too long, to drive on the carriageway without driving on or over the edge line;
    or

    (d) permitted to drive on or over the edge line under another written law of the State; or

    (e) avoiding an obstruction.'
  text_en_is_translation: false
  norm: permissive
  actions_stated:
    cross_line: allowed
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-129(3)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 129(3)
  page: 206
  marking_type: continuous white edge line
  element: boundary
  text_original: 'A driver may drive on or over a continuous white edge line on a carriageway for up to 100 m if the driver
    is —

    (a) turning at an intersection; or

    (b) entering or leaving the carriageway; or

    (c) entering a part of the road of one kind from a part of the road of another kind (for example, moving to or from a
    service road, a shoulder of the road, an emergency stopping bay or an emergency stopping lane); or

    (d) stopping at the side of the road (including any shoulder of the road).'
  text_en: 'A driver may drive on or over a continuous white edge line on a carriageway for up to 100 m if the driver is —

    (a) turning at an intersection; or

    (b) entering or leaving the carriageway; or

    (c) entering a part of the road of one kind from a part of the road of another kind (for example, moving to or from a
    service road, a shoulder of the road, an emergency stopping bay or an emergency stopping lane); or

    (d) stopping at the side of the road (including any shoulder of the road).'
  text_en_is_translation: false
  norm: permissive
  actions_stated:
    cross_line: allowed
  verified_quote: true
  norm_check: agrees
