- rule_id: AU-WA-179(1)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 179(1)
  page: 263
  marking_type: parking bay markings
  element: area
  text_original: Subject to subregulation (2), a driver parking a vehicle on a length of carriageway, or in an area, on which
    parking bays are marked (whether or not a “park in bays only” sign applies) must position the vehicle completely within
    a single bay.
  text_en: Subject to subregulation (2), a driver parking a vehicle on a length of carriageway, or in an area, on which parking
    bays are marked (whether or not a “park in bays only” sign applies) must position the vehicle completely within a single
    bay.
  text_en_is_translation: false
