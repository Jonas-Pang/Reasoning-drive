- rule_id: AU-WA-92(5)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 92(5)
  page: 174
  marking_type: roundabout entry traffic lane arrows
  element: lane_marking
  text_original: 'Despite subregulations (2) to (4), if a driver is entering a roundabout from a marked lane and there are
    traffic lane arrows applying to the lane, the driver must —

    (a) if the arrows indicate a single direction — drive in that direction after entering the roundabout; or

    (b) if the arrows indicate 2 or more directions — drive in one of those directions after entering the roundabout.'
  text_en: 'Despite subregulations (2) to (4), if a driver is entering a roundabout from a marked lane and there are traffic
    lane arrows applying to the lane, the driver must —

    (a) if the arrows indicate a single direction — drive in that direction after entering the roundabout; or

    (b) if the arrows indicate 2 or more directions — drive in one of those directions after entering the roundabout.'
