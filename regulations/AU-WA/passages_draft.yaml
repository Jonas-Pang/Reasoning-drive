- rule_id: AU-WA-21(3A)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 21(3A)
  page: 80
  marking_type: bicycle storage area
  element: area
  text_original: If there is a bicycle storage area before an intersection that extends across one or more marked lanes of
    a multi-lane carriageway, a rider of a bicycle or electric rideable device turning left must approach and enter the intersection
    from within the part of the bicycle storage area that is directly in front of the left marked lane, or of a bicycle lane
    or shoulder that is on the left side of the carriageway.
  text_en: If there is a bicycle storage area before an intersection that extends across one or more marked lanes of a multi-lane
    carriageway, a rider of a bicycle or electric rideable device turning left must approach and enter the intersection from
    within the part of the bicycle storage area that is directly in front of the left marked lane, or of a bicycle lane or
    shoulder that is on the left side of the carriageway.
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
