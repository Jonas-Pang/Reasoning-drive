- rule_id: AU-WA-177(1)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 177(1)
  page: 260
  marking_type: parallel parking road marking
  element: area
  text_original: This regulation applies to the driver of a vehicle (other than a motor cycle) who parks in a median strip
    parking area if a parking control sign or road marking applies to the area, and information on or with the sign or road
    marking indicates that the vehicle must be positioned parallel to the median strip.
  text_en: This regulation applies to the driver of a vehicle (other than a motor cycle) who parks in a median strip parking
    area if a parking control sign or road marking applies to the area, and information on or with the sign or road marking
    indicates that the vehicle must be positioned parallel to the median strip.
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-178(2)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 178(2)
  page: 260
  marking_type: 45-degree angle parking road marking
  element: area
  text_original: 'If information on or with the parking control sign or road marking indicates that the driver’s vehicle must
    be positioned at an angle of 45, or does not indicate a particular angle, the driver must position the vehicle —

    (a) so the vehicle is at an angle as near as practicable to 45; and

    (b) if the vehicle is parked on the side of a carriageway — with the rear of the vehicle nearest to traffic in the marked
    lane or line of traffic next to the part of the carriageway where the driver parks.'
  text_en: 'If information on or with the parking control sign or road marking indicates that the driver’s vehicle must be
    positioned at an angle of 45, or does not indicate a particular angle, the driver must position the vehicle —

    (a) so the vehicle is at an angle as near as practicable to 45; and

    (b) if the vehicle is parked on the side of a carriageway — with the rear of the vehicle nearest to traffic in the marked
    lane or line of traffic next to the part of the carriageway where the driver parks.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-178(3)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 178(3)
  page: 261
  marking_type: 90-degree angle parking road marking
  element: area
  text_original: 'If information on or with the parking control sign or road marking indicates that the driver’s vehicle must
    be positioned at an angle of 90, the driver —

    (a) must position the vehicle so the vehicle is at an angle as near as practicable to 90; and

    (b) if the vehicle is parked on the side of a carriageway — may position the vehicle with either the front or rear of
    the vehicle nearest to traffic in the marked lane or line of traffic next to the part of the carriageway where the driver
    parks.'
  text_en: 'If information on or with the parking control sign or road marking indicates that the driver’s vehicle must be
    positioned at an angle of 90, the driver —

    (a) must position the vehicle so the vehicle is at an angle as near as practicable to 90; and

    (b) if the vehicle is parked on the side of a carriageway — may position the vehicle with either the front or rear of
    the vehicle nearest to traffic in the marked lane or line of traffic next to the part of the carriageway where the driver
    parks.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
