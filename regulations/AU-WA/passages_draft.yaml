  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-179(2)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 179(2)
  page: 264
  marking_type: parking bay markings
  element: area
  text_original: If a vehicle is too wide or long to fit completely within a single parking bay, the person stopping the vehicle
    must park the vehicle within the minimum number of parking bays needed to park that vehicle.
  text_en: If a vehicle is too wide or long to fit completely within a single parking bay, the person stopping the vehicle
    must park the vehicle within the minimum number of parking bays needed to park that vehicle.
