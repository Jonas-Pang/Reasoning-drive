- rule_id: AU-WA-66
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: '66'
  page: 145
  marking_type: painted island
  element: area
  text_original: 'A driver entering a turning lane from a painted island must give way to —

    (a) any vehicle in the turning lane; or

    (b) if the turning lane and painted island are nearest to the far left side of the road — any vehicle entering the turning
    lane from the marked lane, or line of traffic, immediately to the right of the turning lane; or

    (c) if the turning lane and painted island are nearest to the dividing line or median strip on the road or the far right
    side of the road — any vehicle entering the turning lane from the marked lane, or line of traffic, immediately to the
    left of the turning lane.'
  text_en: 'A driver entering a turning lane from a painted island must give way to —

    (a) any vehicle in the turning lane; or

    (b) if the turning lane and painted island are nearest to the far left side of the road — any vehicle entering the turning
    lane from the marked lane, or line of traffic, immediately to the right of the turning lane; or

    (c) if the turning lane and painted island are nearest to the dividing line or median strip on the road or the far right
    side of the road — any vehicle entering the turning lane from the marked lane, or line of traffic, immediately to the
    left of the turning lane.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-73(1)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 73(1)
  page: 153
  marking_type: traffic lane arrows
  element: lane_marking
  text_original: 'Subject to subregulation (2), if a driver is driving in a marked lane at an intersection and there are traffic
    lane arrows applying to the lane, the driver must —

    (a) if the arrows indicate a single direction — drive in that direction; or

    (b) if the arrows indicate 2 or more directions — drive in one of those directions.'
  text_en: 'Subject to subregulation (2), if a driver is driving in a marked lane at an intersection and there are traffic
    lane arrows applying to the lane, the driver must —

    (a) if the arrows indicate a single direction — drive in that direction; or

    (b) if the arrows indicate 2 or more directions — drive in one of those directions.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-73(2)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 73(2)
  page: 153
  marking_type: traffic lane arrows — exceptions
  element: lane_marking
  text_original: 'Subregulation (1) does not apply to a driver if —

    (a) the intersection is a roundabout; or

    (b) traffic lane arrows indicate a direction to the right (whether or not they also indicate another direction) and the
    driver is making a U turn at the intersection; or

    (c) a traffic sign indicates that a driver of a particular type of vehicle, or in stated circumstances, may drive in a
    direction different to that indicated by the traffic lane arrows; or

    (d) the driver is driving in the direction indicated by traffic lane arrows that apply to one or more marked lanes and
    there is an obstruction in each of those lanes; or

    (e) the driver is turning at an intersection in accordance with regulation 21(2) or 26(2).'
  text_en: 'Subregulation (1) does not apply to a driver if —

    (a) the intersection is a roundabout; or

    (b) traffic lane arrows indicate a direction to the right (whether or not they also indicate another direction) and the
    driver is making a U turn at the intersection; or

    (c) a traffic sign indicates that a driver of a particular type of vehicle, or in stated circumstances, may drive in a
    direction different to that indicated by the traffic lane arrows; or

    (d) the driver is driving in the direction indicated by traffic lane arrows that apply to one or more marked lanes and
    there is an obstruction in each of those lanes; or

    (e) the driver is turning at an intersection in accordance with regulation 21(2) or 26(2).'
  text_en_is_translation: false
  norm: permissive
  actions_stated:
    u_turn: allowed
  verified_quote: true
  norm_check: agrees
