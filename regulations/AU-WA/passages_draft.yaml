- rule_id: AU-WA-41(1)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 41(1)
  page: 108
  marking_type: stop line
  element: transverse
  text_original: Except as provided in regulations 42 and 43A, if a traffic-control signal facing a driver displays a steady
    circular yellow signal or a yellow arrow, the driver must not proceed beyond the stop line associated with the signal
    or the stop line of the lane associated with the signal or in the absence of a stop line, at a point adjacent to the nearest
    appropriate traffic-control signal, unless the driver is so close to the stop line, or traffic-control signal, when the
    circular yellow signal or yellow arrow first appears, that the driver cannot safely stop the vehicle before passing over
    the stop line.
  text_en: Except as provided in regulations 42 and 43A, if a traffic-control signal facing a driver displays a steady circular
    yellow signal or a yellow arrow, the driver must not proceed beyond the stop line associated with the signal or the stop
    line of the lane associated with the signal or in the absence of a stop line, at a point adjacent to the nearest appropriate
    traffic-control signal, unless the driver is so close to the stop line, or traffic-control signal, when the circular yellow
    signal or yellow arrow first appears, that the driver cannot safely stop the vehicle before passing over the stop line.
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
  verified_quote: true
  norm_check: agrees
