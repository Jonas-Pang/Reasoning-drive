- rule_id: AU-WA-120(2)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 120(2)
  page: 195
  marking_type: dividing line
  element: boundary
  text_original: 'A driver on a two-way carriageway with a dividing line may drive to the right of the dividing line to avoid
    an obstruction if —

    (a) the driver has a clear view of any approaching traffic; and

    (b) it is necessary and reasonable, in all the circumstances, for the driver to drive to the right of the dividing line
    to avoid the obstruction; and

    (c) the driver can do so safely.'
  text_en: 'A driver on a two-way carriageway with a dividing line may drive to the right of the dividing line to avoid an
    obstruction if —

    (a) the driver has a clear view of any approaching traffic; and

    (b) it is necessary and reasonable, in all the circumstances, for the driver to drive to the right of the dividing line
    to avoid the obstruction; and

    (c) the driver can do so safely.'
  text_en_is_translation: false
  norm: permissive
  actions_stated:
    cross_line: allowed
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-120(3)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 120(3)
  page: 195
  marking_type: continuous dividing lines
  element: boundary
  text_original: In subregulation (2), if the dividing line is a single continuous dividing line to the left of a broken dividing
    line, a single continuous dividing line only or 2 parallel continuous dividing lines, the hazard in driving to the right
    of such a dividing line must be taken into account in deciding whether it is reasonable to drive to the right of the dividing
    line.
  text_en: In subregulation (2), if the dividing line is a single continuous dividing line to the left of a broken dividing
    line, a single continuous dividing line only or 2 parallel continuous dividing lines, the hazard in driving to the right
    of such a dividing line must be taken into account in deciding whether it is reasonable to drive to the right of the dividing
    line.
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-120(4)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 120(4)
  page: 195
  marking_type: continuous lines and painted island
  element: general
  text_original: 'A driver may drive on a dividing strip, or on or over a single continuous line, or 2 parallel continuous
    lines, or on or over a painted island, to avoid an obstruction if —

    (a) the driver has a clear view of any approaching traffic; and

    (b) it is necessary and reasonable to drive on the dividing strip or painted island to avoid the obstruction; and

    (c) the driver can do so safely.'
  text_en: 'A driver may drive on a dividing strip, or on or over a single continuous line, or 2 parallel continuous lines,
    or on or over a painted island, to avoid an obstruction if —

    (a) the driver has a clear view of any approaching traffic; and

    (b) it is necessary and reasonable to drive on the dividing strip or painted island to avoid the obstruction; and

    (c) the driver can do so safely.'
