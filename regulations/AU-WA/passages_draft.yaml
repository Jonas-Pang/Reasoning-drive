  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 61(2)
  page: 140
  marking_type: children’s crossing
  element: transverse
  text_original: A driver must stop the vehicle before it reaches a children’s crossing, if a “children crossing - stop” sign
    is displayed to face approaching drivers; and must not permit any portion of the vehicle to enter upon the children’s
    crossing, while any pedestrian or relevant rider is on it or while the sign is displayed.
  text_en: A driver must stop the vehicle before it reaches a children’s crossing, if a “children crossing - stop” sign is
    displayed to face approaching drivers; and must not permit any portion of the vehicle to enter upon the children’s crossing,
    while any pedestrian or relevant rider is on it or while the sign is displayed.
