- rule_id: AU-WA-28(4)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 28(4)
  page: 91
  marking_type: bicycle hook turn storage area
  element: area
  text_original: 'If the rider of a bicycle or electric rideable device wants to turn right by making a hook turn at an intersection
    that has a bicycle hook turn storage area on the left side of the intersection as the rider approaches the intersection,
    the rider must take the following initial 2 steps instead of the initial 2 steps listed in subregulation (3):

    1 Approach the intersection from the far left side of the carriageway the rider is leaving and enter the intersection
    by moving into the bicycle hook turn storage area, keeping clear of any marked foot crossing.

    2 Move forward in the bicycle hook turn storage area until the rider is as near as practicable to the far side of the
    carriageway that the rider is entering.'
  text_en: 'If the rider of a bicycle or electric rideable device wants to turn right by making a hook turn at an intersection
    that has a bicycle hook turn storage area on the left side of the intersection as the rider approaches the intersection,
    the rider must take the following initial 2 steps instead of the initial 2 steps listed in subregulation (3):

    1 Approach the intersection from the far left side of the carriageway the rider is leaving and enter the intersection
    by moving into the bicycle hook turn storage area, keeping clear of any marked foot crossing.

    2 Move forward in the bicycle hook turn storage area until the rider is as near as practicable to the far side of the
    carriageway that the rider is entering.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    enter_waiting_area: allowed
  verified_quote: true
  norm_check: agrees
