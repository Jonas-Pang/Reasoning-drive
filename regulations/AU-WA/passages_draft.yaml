- rule_id: AU-WA-116(1)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 116(1)
  page: 189
  marking_type: continuous dividing lines
  element: boundary
  text_original: 'Where a carriageway is marked with a dividing line comprising —

    (a) 2 continuous lines; or

    (b) a continuous line on the left of a broken or dotted line; or

    (c) a continuous line,

    a driver must not permit any portion of the vehicle to travel on, over, or to the right of, the dividing line except for
    the purpose of making a right turn or a U turn, where permissible.'
  text_en: 'Where a carriageway is marked with a dividing line comprising —

    (a) 2 continuous lines; or

    (b) a continuous line on the left of a broken or dotted line; or

    (c) a continuous line,

    a driver must not permit any portion of the vehicle to travel on, over, or to the right of, the dividing line except for
    the purpose of making a right turn or a U turn, where permissible.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
    turn_right: allowed
    u_turn: allowed
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-119(2)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 119(2)
  page: 192
  marking_type: painted island
  element: area
  text_original: 'A person must not drive a vehicle on or over a painted island unless —

    (a) it is to enter or leave the carriageway; or

    (b) it is to avoid an obstruction, in accordance with regulation 120(4); or

    (c) it is to enter a turning lane that begins immediately after the painted island; or

    (d) it is to comply with regulation 124A(1), in accordance with regulation 124A(5).'
  text_en: 'A person must not drive a vehicle on or over a painted island unless —

    (a) it is to enter or leave the carriageway; or

    (b) it is to avoid an obstruction, in accordance with regulation 120(4); or

    (c) it is to enter a turning lane that begins immediately after the painted island; or

    (d) it is to comply with regulation 124A(1), in accordance with regulation 124A(5).'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
  verified_quote: true
  norm_check: agrees
