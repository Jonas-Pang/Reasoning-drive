  page: 139
  marking_type: children’s crossing
  element: transverse
  text_original: A driver approaching a children’s crossing must drive at a speed at which the driver can, if necessary, stop
    safely before the crossing.
  text_en: A driver approaching a children’s crossing must drive at a speed at which the driver can, if necessary, stop safely
