- rule_id: AU-WA-122(2)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 122(2)
  page: 196
  marking_type: marked lanes travelling in the same direction
  element: lane_type
  text_original: Where a carriageway is a one-way carriageway, or has 2 or more marked lanes for vehicles travelling in the
    same direction, a driver may overtake and pass in another marked lane to the left of a vehicle, if conditions permit him
    or her to do so with safety.
  text_en: Where a carriageway is a one-way carriageway, or has 2 or more marked lanes for vehicles travelling in the same
    direction, a driver may overtake and pass in another marked lane to the left of a vehicle, if conditions permit him or
    her to do so with safety.
  text_en_is_translation: false
