- rule_id: AU-WA-213
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: '213'
  page: 296
  marking_type: bicycle lane
  element: lane_type
  text_original: Wherever a bicycle lane is provided as part of a carriageway, and is in a reasonable condition for use, a
    rider of a bicycle or electric rideable device must use that portion of a carriageway and no other.
  text_en: Wherever a bicycle lane is provided as part of a carriageway, and is in a reasonable condition for use, a rider
    of a bicycle or electric rideable device must use that portion of a carriageway and no other.
  text_en_is_translation: false
