- rule_id: AU-WA-273(1)(a)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 273(1)(a)
  page: 363
  marking_type: stop line
  element: transverse
  text_original: 'Where a police officer regulating traffic gives a signal to stop, then —

    (a) a driver approaching the person giving the signal, from the direction towards which the palm of that person’s hand
    is facing, must stop the vehicle at a stop line, or the edge of the intersection, or at a reasonable distance from that
    person, and must not drive forward, until given the signal to proceed;'
  text_en: 'Where a police officer regulating traffic gives a signal to stop, then —

    (a) a driver approaching the person giving the signal, from the direction towards which the palm of that person’s hand
    is facing, must stop the vehicle at a stop line, or the edge of the intersection, or at a reasonable distance from that
    person, and must not drive forward, until given the signal to proceed;'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    go_straight: prohibited
  verified_quote: true
  norm_check: agrees
