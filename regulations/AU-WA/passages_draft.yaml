- rule_id: AU-WA-50(3)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 50(3)
  page: 118
  marking_type: stop line at intersection
  element: transverse
  text_original: 'A driver approaching or at an intersection with a “stop” sign or stop line must give way to a vehicle in,
    entering or approaching the intersection except —

    (a) an oncoming vehicle turning right at the intersection, if a “stop” sign, stop line, “give way” sign or give way line
    applies to the driver of the oncoming vehicle; or

    (b) a vehicle turning left at the intersection using a slip lane; or

    (c) a vehicle making a U turn.'
  text_en: 'A driver approaching or at an intersection with a “stop” sign or stop line must give way to a vehicle in, entering
    or approaching the intersection except —

    (a) an oncoming vehicle turning right at the intersection, if a “stop” sign, stop line, “give way” sign or give way line
    applies to the driver of the oncoming vehicle; or

    (b) a vehicle turning left at the intersection using a slip lane; or

    (c) a vehicle making a U turn.'
  text_en_is_translation: false
