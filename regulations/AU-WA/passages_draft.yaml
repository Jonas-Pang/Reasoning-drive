  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 24(1)
  page: 82
  marking_type: dividing line
  element: boundary
  text_original: 'A driver who is about to make a right turn from a two-way carriageway (other than a multi-lane carriageway)
    at an intersection must approach and enter the intersection —

    (a) so that the vehicle is to the left of, parallel with, and as near as practicable to, the centre of the carriageway;
    or

    (b) if the carriageway has a dividing line or median strip — so that the vehicle is to the left of, parallel to, and as
    near as practicable to, the dividing line or median strip.'
  text_en: 'A driver who is about to make a right turn from a two-way carriageway (other than a multi-lane carriageway) at
    an intersection must approach and enter the intersection —

    (a) so that the vehicle is to the left of, parallel with, and as near as practicable to, the centre of the carriageway;
    or

    (b) if the carriageway has a dividing line or median strip — so that the vehicle is to the left of, parallel to, and as
    near as practicable to, the dividing line or median strip.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    turn_right: prohibited
  verified_quote: true
  norm_check: agrees
