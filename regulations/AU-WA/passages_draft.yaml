- rule_id: AU-WA-119(5)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 119(5)
  page: 193
  marking_type: painted island
  element: area
  text_original: 'Subregulation (2)(a) does not apply in the case of a painted island —

    (a) that separates a carriageway that takes vehicles in one direction from another carriageway that takes vehicles in
    the same direction at a place where the carriageways merge; or

    (b) that separates one part of a carriageway from other parts of the carriageway to create a slip lane.'
  text_en: 'Subregulation (2)(a) does not apply in the case of a painted island —

    (a) that separates a carriageway that takes vehicles in one direction from another carriageway that takes vehicles in
    the same direction at a place where the carriageways merge; or

    (b) that separates one part of a carriageway from other parts of the carriageway to create a slip lane.'
  text_en_is_translation: false
