- rule_id: AU-WA-50(2)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 50(2)
  page: 118
  marking_type: stop line at intersection
  element: transverse
  text_original: 'A driver approaching or at an intersection with a “stop” sign or stop line must stop as near as practicable
    to, but —

    (a) before reaching the stop line; or

    (b) if there is no stop line — before entering the intersection.'
  text_en: 'A driver approaching or at an intersection with a “stop” sign or stop line must stop as near as practicable to,
    but —

    (a) before reaching the stop line; or

    (b) if there is no stop line — before entering the intersection.'
