- rule_id: AU-WA-40(2)(a)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 40(2)(a)
  page: 106
  marking_type: stop line
  element: transverse
  text_original: 'If a traffic-control signal facing a driver displays a red arrow signal and the driver is turning in the
    direction indicated by that arrow —

    (a) if there is a stop line at or near the signal, the driver must stop as near as practicable to, but before reaching
    the stop line and must not proceed beyond the stop line;'
  text_en: 'If a traffic-control signal facing a driver displays a red arrow signal and the driver is turning in the direction
    indicated by that arrow —

    (a) if there is a stop line at or near the signal, the driver must stop as near as practicable to, but before reaching
    the stop line and must not proceed beyond the stop line;'
  text_en_is_translation: false
