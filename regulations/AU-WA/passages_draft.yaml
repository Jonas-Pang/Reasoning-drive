- rule_id: AU-WA-215B(1)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 215B(1)
  page: 297
  marking_type: bicycle storage area
  element: area
  text_original: 'When entering a bicycle storage area, the rider of a bicycle or electric rideable device must give way to
    —

    (a) any vehicle that is in the area; and

    (b) if the area is subject to a green or yellow traffic-control signal — any motor vehicle that is entering or about to
    enter the area, unless the motor vehicle is turning in a direction that is subject to a red traffic arrow; and

    (c) if the area forms part of a lane to which traffic-control signal arrows apply — any motor vehicle that is entering
    or about to enter the area at a time when those arrows are green or yellow.'
  text_en: 'When entering a bicycle storage area, the rider of a bicycle or electric rideable device must give way to —

    (a) any vehicle that is in the area; and

    (b) if the area is subject to a green or yellow traffic-control signal — any motor vehicle that is entering or about to
    enter the area, unless the motor vehicle is turning in a direction that is subject to a red traffic arrow; and

    (c) if the area forms part of a lane to which traffic-control signal arrows apply — any motor vehicle that is entering
    or about to enter the area at a time when those arrows are green or yellow.'
  text_en_is_translation: false
