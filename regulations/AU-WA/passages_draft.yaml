- rule_id: AU-WA-129(5)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 129(5)
  page: 206
  marking_type: continuous white edge line
  element: boundary
  text_original: 'For the purposes of this regulation, a driver drives over a continuous white edge line on a carriageway
    if —

    (a) for a line on the far left side of the carriageway — the driver’s vehicle is wholly or partly to the left of the line;
    or

    (b) for a line on the far right side of the carriageway — the driver’s vehicle is wholly or partly to the right of the
    line.'
  text_en: 'For the purposes of this regulation, a driver drives over a continuous white edge line on a carriageway if —

    (a) for a line on the far left side of the carriageway — the driver’s vehicle is wholly or partly to the left of the line;
    or

    (b) for a line on the far right side of the carriageway — the driver’s vehicle is wholly or partly to the right of the
    line.'
  text_en_is_translation: false
  norm: informative
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-132(1)
