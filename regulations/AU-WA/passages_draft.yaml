  page: 142
  marking_type: pedestrian crossing
  element: transverse
  text_original: A driver must not enter upon, or attempt to cross, a pedestrian crossing if the carriageway beyond it is
    blocked.
  text_en: A driver must not enter upon, or attempt to cross, a pedestrian crossing if the carriageway beyond it is blocked.
