- rule_id: AU-WA-40(3)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 40(3)
  page: 107
  marking_type: bicycle storage area stop lines
  element: transverse
  text_original: 'If there is a bicycle storage area before any traffic-control signal referred to in subregulation (1) or
    (2), a reference to the stop line in subregulation (1)(a) or (2)(a) —

    (a) in the case of a driver of a motor vehicle, is a reference to the first stop line that the driver comes to, or came
    to, in approaching the signal;

    (b) in the case of a rider of a bicycle or electric rideable device, is a reference to the stop line that is nearest to
    the intersection.'
  text_en: 'If there is a bicycle storage area before any traffic-control signal referred to in subregulation (1) or (2),
    a reference to the stop line in subregulation (1)(a) or (2)(a) —

    (a) in the case of a driver of a motor vehicle, is a reference to the first stop line that the driver comes to, or came
    to, in approaching the signal;

    (b) in the case of a rider of a bicycle or electric rideable device, is a reference to the stop line that is nearest to
    the intersection.'
  text_en_is_translation: false
  norm: informative
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
