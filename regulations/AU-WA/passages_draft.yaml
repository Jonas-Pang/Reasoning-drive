    cross_line: prohibited
  verified_quote: true
  norm_check: words say permissive (may)
- rule_id: AU-WA-48
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: '48'
  page: 116
  marking_type: marked foot crossing with flashing yellow signal
  element: transverse
  text_original: 'If a driver is approaching or at a marked foot crossing (except at or near an intersection) with a flashing
    yellow traffic-control signal at the crossing, the driver must —

    (a) give way to any pedestrian or relevant rider on the crossing; and

    (b) not obstruct any pedestrian or relevant rider on the crossing; and

    (c) not pass a vehicle that is travelling in the same direction as the driver and is stopping, or has stopped, to give
    way at the crossing.'
  text_en: 'If a driver is approaching or at a marked foot crossing (except at or near an intersection) with a flashing yellow
    traffic-control signal at the crossing, the driver must —

    (a) give way to any pedestrian or relevant rider on the crossing; and

    (b) not obstruct any pedestrian or relevant rider on the crossing; and

    (c) not pass a vehicle that is travelling in the same direction as the driver and is stopping, or has stopped, to give
    way at the crossing.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-49(1)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 49(1)
  page: 117
  marking_type: stop line at twin alternating red lights
  element: transverse
  text_original: If a driver is approaching or at a traffic-control signal displaying twin alternating red lights (other than
    at a level crossing) and there is a stop line at or near the lights and the driver can stop safely before reaching the
    stop line, the driver must stop as near as practicable to, but before reaching, the stop line.
  text_en: If a driver is approaching or at a traffic-control signal displaying twin alternating red lights (other than at
    a level crossing) and there is a stop line at or near the lights and the driver can stop safely before reaching the stop
    line, the driver must stop as near as practicable to, but before reaching, the stop line.
