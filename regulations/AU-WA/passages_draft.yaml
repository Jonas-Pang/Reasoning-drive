- rule_id: AU-WA-133
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: '133'
  page: 213
  marking_type: bus lane
  element: lane_type
  text_original: 'A person must not drive a vehicle along or into a bus lane unless —

    (a) the vehicle is a public bus, an emergency vehicle or a special purpose vehicle; or

    (b) the driver is permitted to do so under regulation 136.'
  text_en: 'A person must not drive a vehicle along or into a bus lane unless —

    (a) the vehicle is a public bus, an emergency vehicle or a special purpose vehicle; or

    (b) the driver is permitted to do so under regulation 136.'
