- rule_id: AU-WA-134
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: '134'
  page: 215
  marking_type: transit lane
  element: lane_type
  text_original: 'A driver must not drive in a transit lane unless —

    (a) the driver is driving —

    (i) a public bus, motor cycle, or taxi; or

    (ii) if the transit lane sign applying to the transit lane is a “transit lane (T2)” sign — a vehicle carrying at least
    one other person; or

    (iii) if the transit lane sign applying to the transit lane is a “transit lane (T3)” sign — a vehicle carrying at least
    2 other people;

    or

    (b) the driver is permitted to drive in the transit lane under regulation 136.'
  text_en: 'A driver must not drive in a transit lane unless —

    (a) the driver is driving —

    (i) a public bus, motor cycle, or taxi; or

    (ii) if the transit lane sign applying to the transit lane is a “transit lane (T2)” sign — a vehicle carrying at least
    one other person; or

    (iii) if the transit lane sign applying to the transit lane is a “transit lane (T3)” sign — a vehicle carrying at least
    2 other people;

    or

    (b) the driver is permitted to drive in the transit lane under regulation 136.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    go_straight: prohibited
  verified_quote: true
  norm_check: agrees
