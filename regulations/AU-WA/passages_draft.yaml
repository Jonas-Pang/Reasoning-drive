  norm_check: agrees
- rule_id: AU-WA-133A(1)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 133A(1)
  page: 214
  marking_type: busway
  element: lane_type
  text_original: 'A person must not drive a vehicle along or into a busway unless —

    (a) the vehicle is a public bus, an emergency vehicle or a special purpose vehicle; or

    (b) a taxi, and there is a sign at the beginning of the busway indicating that taxis may enter that busway.'
