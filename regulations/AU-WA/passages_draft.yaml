  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-214
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: '214'
  page: 296
  marking_type: children’s crossing, marked foot crossing or pedestrian crossing
  element: transverse
  text_original: 'The rider of a bicycle or electric rideable device riding across a carriageway, or part of a carriageway,
    on a children’s crossing, marked foot crossing or pedestrian crossing must —

    (a) enter the crossing from the path connected to the crossing and not from the carriageway; and

    (b) approach and ride on the crossing at a speed not exceeding 10 km/h; and

    (c) keep to the left of the crossing unless it is impracticable to do so; and

    (d) give way to any pedestrians on the crossing.'
  text_en: 'The rider of a bicycle or electric rideable device riding across a carriageway, or part of a carriageway, on a
    children’s crossing, marked foot crossing or pedestrian crossing must —

    (a) enter the crossing from the path connected to the crossing and not from the carriageway; and

    (b) approach and ride on the crossing at a speed not exceeding 10 km/h; and

    (c) keep to the left of the crossing unless it is impracticable to do so; and

    (d) give way to any pedestrians on the crossing.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-WA-215A(1)
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: 215A(1)
  page: 297
  marking_type: bicycle storage area
  element: area
  text_original: The rider of a bicycle or electric rideable device approaching a bicycle storage area at an intersection
    that has traffic-control signals showing a circular red signal or red arrow signal must not enter the bicycle storage
    area other than from a bicycle lane.
  text_en: The rider of a bicycle or electric rideable device approaching a bicycle storage area at an intersection that has
    traffic-control signals showing a circular red signal or red arrow signal must not enter the bicycle storage area other
