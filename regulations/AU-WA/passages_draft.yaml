- rule_id: AU-WA-3
  region: AU-WA
  source: Road Traffic Code 2000 (WA), version 05-aa0-00 (14 May 2026)
  section: '3'
  page: 23
  marking_type: bicycle lane marking
  element: lane_type
  text_original: 'bicycle lane means a marked lane, or the part of a marked lane —

    (a) beginning at a “bicycle lane” sign applying to the lane, or a road marking comprising a white bicycle symbol and the
    word “lane” painted in white; and

    (b) ending at the nearest of the following —

    (i) an “end bicycle lane” sign applying to the lane, or a road marking comprising a white bicycle symbol and the words
    “end lane” painted in white;

    (ii) an intersection (unless the lane is at the unbroken side of the continuing road at a T-intersection or continued
    across the intersection by broken lines);

    (iii) if the carriageway ends at a dead end — the end of the carriageway;'
  text_en: 'bicycle lane means a marked lane, or the part of a marked lane —

    (a) beginning at a “bicycle lane” sign applying to the lane, or a road marking comprising a white bicycle symbol and the
    word “lane” painted in white; and

    (b) ending at the nearest of the following —

    (i) an “end bicycle lane” sign applying to the lane, or a road marking comprising a white bicycle symbol and the words
    “end lane” painted in white;

    (ii) an intersection (unless the lane is at the unbroken side of the continuing road at a T-intersection or continued
    across the intersection by broken lines);

    (iii) if the carriageway ends at a dead end — the end of the carriageway;'
