- rule_id: SG-RULES-26
  region: SG
  source: Road Traffic Rules (R 20)
  document: rules
  section: '26'
  page: 9
  marking_type: yellow box
  element: area
  text_original: 'Any person who drives or rides, or turns a vehicle or part thereof into a yellow box indicated by yellow
    lines connecting the 4 corners of —

    ( a ) a road junction and hatching the junction diagonally, notwithstanding that the light signals controlling the movement
    of vehicular traffic permit him to do so; or

    ( b ) an area of road at a road junction or on any part of the road as defined under rule 7(8) of the Road Traffic (Traffic
    Signs) Rules (R 33), notwithstanding that he has the right of way,

    and by doing so causes obstruction to any other vehicle proceeding to or along that road junction or any part of the road
    shall be guilty of an offence.'
  text_en: 'Any person who drives or rides, or turns a vehicle or part thereof into a yellow box indicated by yellow lines
    connecting the 4 corners of —

    ( a ) a road junction and hatching the junction diagonally, notwithstanding that the light signals controlling the movement
    of vehicular traffic permit him to do so; or

    ( b ) an area of road at a road junction or on any part of the road as defined under rule 7(8) of the Road Traffic (Traffic
    Signs) Rules (R 33), notwithstanding that he has the right of way,

    and by doing so causes obstruction to any other vehicle proceeding to or along that road junction or any part of the road
    shall be guilty of an offence.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    go_straight: prohibited
    turn_left: prohibited
    turn_right: prohibited
  verified_quote: true
  norm_check: agrees
- rule_id: SG-RULES-26A(1)
  region: SG
  source: Road Traffic Rules (R 20)
  document: rules
  section: 26A(1)
  page: 10
  marking_type: Bus Give-Way Line
  element: transverse
  text_original: 'Where —

    ( a ) a bus is entering a Bus Give-Way Box from a bus stop or a bus bay; or

    ( b ) a bus which is at a bus stop, or a bus bay, stops before entering a Bus Give-Way Box and the driver of the bus signals
    his intention to turn the bus into the Bus Give-Way Box,

    the driver or rider of a vehicle, driving or riding the vehicle in a Bus Give-Way Controlled Area and approaching the
    Bus Give-Way Box, shall stop before the Bus Give-Way Line and give way to the bus entering or waiting to enter the Bus
    Give-Way Box.'
  text_en: 'Where —

    ( a ) a bus is entering a Bus Give-Way Box from a bus stop or a bus bay; or

    ( b ) a bus which is at a bus stop, or a bus bay, stops before entering a Bus Give-Way Box and the driver of the bus signals
    his intention to turn the bus into the Bus Give-Way Box,

    the driver or rider of a vehicle, driving or riding the vehicle in a Bus Give-Way Controlled Area and approaching the
    Bus Give-Way Box, shall stop before the Bus Give-Way Line and give way to the bus entering or waiting to enter the Bus
    Give-Way Box.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
  verified_quote: true
  norm_check: agrees
