- rule_id: SG-RULES-7
  region: SG
  source: Road Traffic Rules (R 20)
  document: rules
  section: '7'
  page: 6
  marking_type: directional arrows
  element: lane_marking
  text_original: The driver or rider of a vehicle who intends to turn to the right at an intersection or junction of roads
    shall, before reaching such intersection or junction and as opportunity offers, move into the appropriate lane as indicated
    by the directional arrows to turn right and any driver or rider of a vehicle intending to turn to the left shall, as opportunity
    offers, move into the appropriate lane as indicated by the directional arrows to turn left.
  text_en: The driver or rider of a vehicle who intends to turn to the right at an intersection or junction of roads shall,
    before reaching such intersection or junction and as opportunity offers, move into the appropriate lane as indicated by
    the directional arrows to turn right and any driver or rider of a vehicle intending to turn to the left shall, as opportunity
    offers, move into the appropriate lane as indicated by the directional arrows to turn left.
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    turn_left: allowed
    turn_right: allowed
  verified_quote: true
  norm_check: agrees
