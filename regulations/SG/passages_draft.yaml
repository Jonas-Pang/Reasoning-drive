- rule_id: SG-SIGNS-8(1)
  region: SG
  source: Road Traffic (Traffic Signs) Rules (R 33)
  document: signs
  section: 8(1)
  page: 8
  marking_type: part-day bus lane
  element: lane_type
  text_original: Except on any Saturday, Sunday or public holiday, no person shall drive a vehicle other than an omnibus,
    or cause or permit any such vehicle to remain, on a part-day bus lane during the hours of 7.30 a.m. to 9.30 a.m. and 5
    p.m. to 8 p.m.
  text_en: Except on any Saturday, Sunday or public holiday, no person shall drive a vehicle other than an omnibus, or cause
    or permit any such vehicle to remain, on a part-day bus lane during the hours of 7.30 a.m. to 9.30 a.m. and 5 p.m. to
    8 p.m.
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    go_straight: prohibited
  verified_quote: true
  norm_check: agrees
