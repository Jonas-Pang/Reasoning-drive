- rule_id: SG-SIGNS-8(2)
  region: SG
  source: Road Traffic (Traffic Signs) Rules (R 33)
  document: signs
  section: 8(2)
  page: 8
  marking_type: bus lane exceptions
  element: lane_type
  text_original: 'Paragraphs (1), (1A) and (1B) shall not apply to —

    ( a ) the driver of an authorised ambulance, fire engine or any vehicle for police or rescue purposes on urgent duty call
    if the approach of such vehicle is made known by means of some distinctive siren, bell or multi-toned horn, as the case
    may be;

    ( b ) a cyclist who is not cycling alongside of another bicycle, three‑wheeled pedal cycle, recumbent device or power‑assisted
    bicycle on his left;

    ( c ) the driver of a motor vehicle who drives along the bus lane in order to avoid causing danger to any person or a
    collision with any other vehicle if that driver does not cause or permit the vehicle to remain on the bus lane longer
    than is necessary to avoid causing such danger or collision;

    ( d ) the driver of a school bus, a private hire bus or an excursion bus when it is used to carry passengers for reward
    under a Supplementary Public Transport Scheme in accordance with —

    (i) a public service vehicle licence that is issued for that bus under section 102 of the Act; and

    (ii) a bus service licence that is granted or is deemed granted under section 13 of the Bus Services Industry Act 2015
    (Act 30 of 2015); and

    ( e ) the driver of any other bus except that he shall not stop the bus in a bus lane or at a bus stand or bus bay within
    a bus lane for any purpose other than for the purpose of negotiating traffic.'
  text_en: 'Paragraphs (1), (1A) and (1B) shall not apply to —

    ( a ) the driver of an authorised ambulance, fire engine or any vehicle for police or rescue purposes on urgent duty call
    if the approach of such vehicle is made known by means of some distinctive siren, bell or multi-toned horn, as the case
    may be;

    ( b ) a cyclist who is not cycling alongside of another bicycle, three‑wheeled pedal cycle, recumbent device or power‑assisted
    bicycle on his left;

    ( c ) the driver of a motor vehicle who drives along the bus lane in order to avoid causing danger to any person or a
    collision with any other vehicle if that driver does not cause or permit the vehicle to remain on the bus lane longer
    than is necessary to avoid causing such danger or collision;

    ( d ) the driver of a school bus, a private hire bus or an excursion bus when it is used to carry passengers for reward
    under a Supplementary Public Transport Scheme in accordance with —

    (i) a public service vehicle licence that is issued for that bus under section 102 of the Act; and

    (ii) a bus service licence that is granted or is deemed granted under section 13 of the Bus Services Industry Act 2015
    (Act 30 of 2015); and

    ( e ) the driver of any other bus except that he shall not stop the bus in a bus lane or at a bus stand or bus bay within
    a bus lane for any purpose other than for the purpose of negotiating traffic.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    go_straight: allowed
  verified_quote: true
  norm_check: agrees
- rule_id: SG-SIGNS-8(2A)
  region: SG
  source: Road Traffic (Traffic Signs) Rules (R 33)
  document: signs
  section: 8(2A)
  page: 8
  marking_type: bus-only lane exceptions
  element: lane_type
  text_original: 'In addition, paragraph (1B) does not apply to —

    ( a ) the driver of a vehicle which is being used —

    (i) by the Authority to carry out any function or duty of the Authority;

    (ii) to carry out works on a public street, where such works have been approved by the Authority under section 17(1) of
    the Street Works Act 1995; or

    (iii) to carry out any emergency works on a public street mentioned in regulation 31(1) of the Street Works (Works on
    Public Streets) Regulations (Rg 2);

    ( b ) the driver of a vehicle which has been authorised by the National Parks Board, the Public Utilities Board or the
    National Environment Agency (as the case may be) to be used to carry out any works that require the use of the bus-only
    lane and are necessary to carry out any function or duty of the National Parks Board, the Public Utilities Board or the
    National Environment Agency (as the case may be), other than the works mentioned in regulation 31(1) of the Street Works
    (Works on Public Streets) Regulations; and

    ( c ) the driver of a vehicle which has been authorised by the licensee of any bus interchange, bus park, bus terminal
    or bus depot (as the case may be) to be used by that licensee, provided that the vehicle is being driven on a bus-only
    lane that leads into or out of any bus interchange, bus park, bus terminal or bus depot, as the case may be.'
  text_en: 'In addition, paragraph (1B) does not apply to —

    ( a ) the driver of a vehicle which is being used —

    (i) by the Authority to carry out any function or duty of the Authority;

    (ii) to carry out works on a public street, where such works have been approved by the Authority under section 17(1) of
    the Street Works Act 1995; or

    (iii) to carry out any emergency works on a public street mentioned in regulation 31(1) of the Street Works (Works on
    Public Streets) Regulations (Rg 2);

    ( b ) the driver of a vehicle which has been authorised by the National Parks Board, the Public Utilities Board or the
    National Environment Agency (as the case may be) to be used to carry out any works that require the use of the bus-only
    lane and are necessary to carry out any function or duty of the National Parks Board, the Public Utilities Board or the
    National Environment Agency (as the case may be), other than the works mentioned in regulation 31(1) of the Street Works
    (Works on Public Streets) Regulations; and

    ( c ) the driver of a vehicle which has been authorised by the licensee of any bus interchange, bus park, bus terminal
    or bus depot (as the case may be) to be used by that licensee, provided that the vehicle is being driven on a bus-only
    lane that leads into or out of any bus interchange, bus park, bus terminal or bus depot, as the case may be.'
  text_en_is_translation: false
  norm: informative
  actions_stated:
    go_straight: allowed
  verified_quote: true
  norm_check: words say permissive (may)
