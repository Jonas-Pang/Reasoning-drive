  section: '25'
  page: 9
  marking_type: perpendicular yellow lines
  element: area
  text_original: 'No person shall stop or park any vehicle on any part of a road which is marked by perpendicular yellow lines
    for the purpose of loading or unloading goods —

    ( a ) on Mondays to Fridays (with the exception of gazetted public holidays) between the hours of —

    (i) 7.30 a.m. and 9.30 a.m.;

    (ii) 12.30 p.m. and 2 p.m.; and

    (iii) 4 p.m. and 6 p.m.; and

    ( b ) on Saturdays (with the exception of gazetted public holidays) between the hours of —

    (i) 7.30 a.m. and 9.30 a.m.; and

    (ii) 12 noon and 2 p.m.'
