  page: 47
  marking_type: traffic lane arrows
  element: lane_marking
  text_original: If a driver is driving in a marked lane at an intersection (except a roundabout) and there are traffic lane
    arrows applying to the lane, the driver must – (a) if the arrows indicate a single direction – drive in that direction;
    or (b) if the arrows indicate 2 or more directions – drive in one of those directions.
  text_en: If a driver is driving in a marked lane at an intersection (except a roundabout) and there are traffic lane arrows
    applying to the lane, the driver must – (a) if the arrows indicate a single direction – drive in that direction; or (b)
    if the arrows indicate 2 or more directions – drive in one of those directions.
