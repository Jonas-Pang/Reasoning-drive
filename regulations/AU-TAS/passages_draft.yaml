- rule_id: AU-TAS-210(3)
  region: AU-TAS
  source: Road Rules 2019 (Tas), current version
  section: 210(3)
  page: 106
  marking_type: 90-degree parking marking
  element: area
  text_original: If the parking control sign or road marking indicates that the vehicle must be positioned at an angle of
    90 degrees, the driver – (a) must position the driver’s vehicle so the vehicle is at an angle as near as practicable to
    90 degrees; and (b) if the vehicle is parked on the side of the road – (i) if the road marking, or information on the
    parking control sign, includes the words ‘rear in’ or ‘front in’, or similar words – must position the vehicle so that
    the front of the vehicle is nearest the centre of the road, or the rear of the vehicle is nearest the centre of the road,
    in accordance with the road marking or sign; or (ii) otherwise – may position the vehicle either way around.
  text_en: If the parking control sign or road marking indicates that the vehicle must be positioned at an angle of 90 degrees,
    the driver – (a) must position the driver’s vehicle so the vehicle is at an angle as near as practicable to 90 degrees;
    and (b) if the vehicle is parked on the side of the road – (i) if the road marking, or information on the parking control
    sign, includes the words ‘rear in’ or ‘front in’, or similar words – must position the vehicle so that the front of the
    vehicle is nearest the centre of the road, or the rear of the vehicle is nearest the centre of the road, in accordance
    with the road marking or sign; or (ii) otherwise – may position the vehicle either way around.
