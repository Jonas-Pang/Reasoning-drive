- rule_id: AU-TAS-139(2)
  region: AU-TAS
  source: Road Rules 2019 (Tas), current version
  section: 139(2)
  page: 67
  marking_type: dividing line
  element: boundary
  text_original: A driver on a road with a dividing line may drive to the right of the dividing line to avoid an obstruction
    if – (a) the driver has a clear view of any approaching traffic; and (b) it is necessary and reasonable, in all the circumstances,
    for the driver to drive to the right of the dividing line to avoid the obstruction; and (c) the driver can do so safely.
  text_en: A driver on a road with a dividing line may drive to the right of the dividing line to avoid an obstruction if
    – (a) the driver has a clear view of any approaching traffic; and (b) it is necessary and reasonable, in all the circumstances,
    for the driver to drive to the right of the dividing line to avoid the obstruction; and (c) the driver can do so safely.
