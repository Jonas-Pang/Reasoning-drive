- rule_id: AU-TAS-158(1)
  region: AU-TAS
  source: Road Rules 2019 (Tas), current version
  section: 158(1)
  page: 81
  marking_type: special purpose lanes
  element: lane_type
  text_original: The driver of any vehicle may drive for up to the permitted distance in a bicycle lane, bus lane, tram lane,
    transit lane or truck lane if it is necessary for the driver to drive in the lane – (a) to enter or leave the road; or
    (b) to enter a part of the road of one kind from a part of the road of another kind (for example, moving to or from a
    service road, the shoulder of the road or an emergency stopping lane); or (c) to overtake a vehicle that is turning right,
    or making a U-turn from the centre of the road, and is giving a right change of direction signal; or (d) to enter a marked
    lane, or part of the road where there is room for a line of traffic (other than motor bikes, bicycles, motorised wheelchairs
    or animals), from the side of the road.
  text_en: The driver of any vehicle may drive for up to the permitted distance in a bicycle lane, bus lane, tram lane, transit
    lane or truck lane if it is necessary for the driver to drive in the lane – (a) to enter or leave the road; or (b) to
    enter a part of the road of one kind from a part of the road of another kind (for example, moving to or from a service
    road, the shoulder of the road or an emergency stopping lane); or (c) to overtake a vehicle that is turning right, or
    making a U-turn from the centre of the road, and is giving a right change of direction signal; or (d) to enter a marked
    lane, or part of the road where there is room for a line of traffic (other than motor bikes, bicycles, motorised wheelchairs
    or animals), from the side of the road.
  text_en_is_translation: false
  norm: permissive
  actions_stated:
    go_straight: allowed
  verified_quote: true
  norm_check: agrees
