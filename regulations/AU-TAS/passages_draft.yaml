- rule_id: AU-TAS-154A(2)
  region: AU-TAS
  source: Road Rules 2019 (Tas), current version
  section: 154A (2)
  page: 78
  marking_type: bus only lane
  element: lane_type
  text_original: A driver may drive in a bus only lane if – (a) it is necessary for the driver to drive in the bus only lane
    to avoid an obstruction; and (b) the driver does not obstruct the path of a public bus travelling in the bus only lane;
    and (c) where the driver is approaching the bus only lane from the same direction as a vehicle in a bus only lane – the
    driver approaches the bus only lane from the lane nearest to the bus only lane; and (d) the driver gives way to any vehicles
    driving in the bus only lane.
  text_en: A driver may drive in a bus only lane if – (a) it is necessary for the driver to drive in the bus only lane to
    avoid an obstruction; and (b) the driver does not obstruct the path of a public bus travelling in the bus only lane; and
    (c) where the driver is approaching the bus only lane from the same direction as a vehicle in a bus only lane – the driver
    approaches the bus only lane from the lane nearest to the bus only lane; and (d) the driver gives way to any vehicles
    driving in the bus only lane.
