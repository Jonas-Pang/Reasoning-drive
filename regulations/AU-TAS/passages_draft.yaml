- rule_id: AU-TAS-56(1)
  region: AU-TAS
  source: Road Rules 2019 (Tas), current version
  section: 56(1)
  page: 20
  marking_type: stop line at traffic lights
  element: transverse
  text_original: A driver approaching or at traffic lights showing a red traffic light must stop – (a) if there is a stop
    line at or near the traffic lights – as near as practicable to, but before reaching, the stop line; or (b) if there is
    a stop here on red signal sign at or near the traffic lights, but no stop line – as near as practicable to, but before
    reaching, the sign; or (c) if there is no stop line or stop here on red signal sign at or near the traffic lights – as
    near as practicable to, but before reaching, the nearest or only traffic lights – and must not proceed past the stop line,
    stop here on red signal sign or nearest or only traffic lights (as the case may be) until the traffic lights show a green
    or flashing yellow traffic light or no traffic light.
  text_en: A driver approaching or at traffic lights showing a red traffic light must stop – (a) if there is a stop line at
    or near the traffic lights – as near as practicable to, but before reaching, the stop line; or (b) if there is a stop
    here on red signal sign at or near the traffic lights, but no stop line – as near as practicable to, but before reaching,
    the sign; or (c) if there is no stop line or stop here on red signal sign at or near the traffic lights – as near as practicable
    to, but before reaching, the nearest or only traffic lights – and must not proceed past the stop line, stop here on red
    signal sign or nearest or only traffic lights (as the case may be) until the traffic lights show a green or flashing yellow
    traffic light or no traffic light.
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
  verified_quote: true
  norm_check: agrees
