- rule_id: AU-TAS-147(1)
  region: AU-TAS
  source: Road Rules 2019 (Tas), current version
  section: 147(1)
  page: 72
  marking_type: continuous lane line
  element: boundary
  text_original: A driver on a multi-lane road must not move from one marked lane to another marked lane by crossing a continuous
    line separating the lanes unless – (a) the driver is avoiding an obstruction; or (b) the driver is obeying a traffic control
    device applying to the first marked lane; or (c) the driver is permitted to drive in both marked lanes under another provision
    of the Road Rules or under another law of this jurisdiction; or (d) either of the marked lanes is a special purpose lane
    in which the driver is permitted to drive under the Road Rules and the driver is moving to or from the special purpose
    lane; or (e) either of the marked lanes is a special purpose lane during specified times only and the driver – (i) is
    moving to or from that lane outside of the times during which it is a special purpose lane; and (ii) is permitted to drive
    in that lane outside of the times during which it is a special purpose lane under the Road Rules ; or (f) the driver is
    the rider of a motor bike and is lane filtering in accordance with rule 151A.
  text_en: A driver on a multi-lane road must not move from one marked lane to another marked lane by crossing a continuous
    line separating the lanes unless – (a) the driver is avoiding an obstruction; or (b) the driver is obeying a traffic control
    device applying to the first marked lane; or (c) the driver is permitted to drive in both marked lanes under another provision
    of the Road Rules or under another law of this jurisdiction; or (d) either of the marked lanes is a special purpose lane
    in which the driver is permitted to drive under the Road Rules and the driver is moving to or from the special purpose
    lane; or (e) either of the marked lanes is a special purpose lane during specified times only and the driver – (i) is
    moving to or from that lane outside of the times during which it is a special purpose lane; and (ii) is permitted to drive
    in that lane outside of the times during which it is a special purpose lane under the Road Rules ; or (f) the driver is
    the rider of a motor bike and is lane filtering in accordance with rule 151A.
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
  verified_quote: true
  norm_check: agrees
- rule_id: AU-TAS-147(2)
  region: AU-TAS
  source: Road Rules 2019 (Tas), current version
  section: 147(2)
  page: 73
  marking_type: continuous lane line
  element: boundary
  text_original: A driver on a multi-lane road may move from one marked lane to another marked lane by crossing a continuous
    line separating the lanes if – (a) the driver makes the move to approach or enter an intersection from the multi-lane
    road and rule 28(2) or 32(2) applies to the driver for the purpose of making the move; or (b) the driver makes the move
    to approach or enter a roundabout from the multi-lane road and rule 111(8) or (9) applies to the driver for the purpose
    of making the move; or (c) the driver is overtaking or passing the rider of a bicycle that is travelling in the same direction
    as the driver and the driver can perform the movement safely.
  text_en: A driver on a multi-lane road may move from one marked lane to another marked lane by crossing a continuous line
    separating the lanes if – (a) the driver makes the move to approach or enter an intersection from the multi-lane road
    and rule 28(2) or 32(2) applies to the driver for the purpose of making the move; or (b) the driver makes the move to
    approach or enter a roundabout from the multi-lane road and rule 111(8) or (9) applies to the driver for the purpose of
    making the move; or (c) the driver is overtaking or passing the rider of a bicycle that is travelling in the same direction
    as the driver and the driver can perform the movement safely.
  text_en_is_translation: false
  norm: permissive
  actions_stated:
    cross_line: allowed
  verified_quote: true
  norm_check: agrees
