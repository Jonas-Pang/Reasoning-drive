- rule_id: AU-TAS-92(2)
  region: AU-TAS
  source: Road Rules 2019 (Tas), current version
  section: 92(2)
  page: 47
  marking_type: traffic lane arrows
  element: lane_marking
  text_original: However, this rule does not apply to a driver if – (a) the arrows indicate a direction to the right (whether
    or not they also indicate another direction) at an intersection and the driver is making a U–turn at the intersection;
    or (b) a traffic sign indicates that the driver may drive in a direction different to that indicated by the traffic lane
    arrows; or (c) the driver is driving in the direction indicated by traffic lane arrows that apply to 1 or more marked
    lanes and there is an obstruction in each of those lanes; or (d) the driver is turning at an intersection in accordance
    with subrules 28(2) or 32(2).
  text_en: However, this rule does not apply to a driver if – (a) the arrows indicate a direction to the right (whether or
    not they also indicate another direction) at an intersection and the driver is making a U–turn at the intersection; or
    (b) a traffic sign indicates that the driver may drive in a direction different to that indicated by the traffic lane
    arrows; or (c) the driver is driving in the direction indicated by traffic lane arrows that apply to 1 or more marked
    lanes and there is an obstruction in each of those lanes; or (d) the driver is turning at an intersection in accordance
    with subrules 28(2) or 32(2).
  text_en_is_translation: false
