    lights; or (c) if the traffic lights are at an intersection and the driver cannot stop safely in accordance with paragraph
    (a) or (b), but can stop safely before entering the intersection – before entering the intersection – and must not proceed
    past the stop line or nearest or only traffic lights, or into the intersection (as the case may be), until the traffic
