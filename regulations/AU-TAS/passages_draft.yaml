- rule_id: AU-TAS-85
  region: AU-TAS
  source: Road Rules 2019 (Tas), current version
  section: '85'
  page: 44
  marking_type: painted island
  element: area
  text_original: A driver entering a turning lane from a painted island must give way to – (a) any vehicle in the turning
    lane; or (b) if the turning lane and painted island are nearest to the far left side of the road – any vehicle entering
    the turning lane from the marked lane, or line of traffic, immediately to the right of the turning lane; or (c) if the
    turning lane and painted island are nearest to the dividing line or median strip on the road or the far right side of
    the road – any vehicle entering the turning lane from the marked lane, or line of traffic, immediately to the left of
    the turning lane.
  text_en: A driver entering a turning lane from a painted island must give way to – (a) any vehicle in the turning lane;
    or (b) if the turning lane and painted island are nearest to the far left side of the road – any vehicle entering the
    turning lane from the marked lane, or line of traffic, immediately to the right of the turning lane; or (c) if the turning
    lane and painted island are nearest to the dividing line or median strip on the road or the far right side of the road
    – any vehicle entering the turning lane from the marked lane, or line of traffic, immediately to the left of the turning
    lane.
