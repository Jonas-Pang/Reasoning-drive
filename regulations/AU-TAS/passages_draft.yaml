  page: 80
  marking_type: double continuous yellow tramway lines
  element: boundary
  text_original: A tramway is a part of a road with tram tracks that – (a) is between a tramway sign and an end tramway sign
    ; and (b) is marked along the left side of the tracks (when facing the direction of travel of a tram on the tracks) by
    either – (i) 2 continuous yellow lines parallel to the tracks; or (ii) a structure (for example, a dividing strip, pedestrian
    refuge, traffic island, row of bollards or separation kerb), whether or not the structure is also being used to indicate
    a safety zone – but does include any part of the road where vehicles are permitted to cross the tramway.
  text_en: A tramway is a part of a road with tram tracks that – (a) is between a tramway sign and an end tramway sign ; and
    (b) is marked along the left side of the tracks (when facing the direction of travel of a tram on the tracks) by either
    – (i) 2 continuous yellow lines parallel to the tracks; or (ii) a structure (for example, a dividing strip, pedestrian
    refuge, traffic island, row of bollards or separation kerb), whether or not the structure is also being used to indicate
    a safety zone – but does include any part of the road where vehicles are permitted to cross the tramway.
