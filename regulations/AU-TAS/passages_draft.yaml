- rule_id: AU-TAS-132(2)Note
  region: AU-TAS
  source: Road Rules 2019 (Tas), current version
  section: 132(2) Note
  page: 63
  marking_type: continuous dividing lines
  element: boundary
  text_original: 'The effect of this subrule, in relation to continuous dividing lines, is as follows: (a) in the case of
    a dividing line that is only a single continuous dividing line, or that is a broken dividing line to the right of a single
    continuous dividing line, a driver may only drive to the right of such a line in the circumstances set out in rule 134(3)
    and 139(2) (as supplemented by rule 139(3)); (b) in the case of a dividing line that is a single continuous dividing line
    to the right of a broken dividing line, a driver may only drive to the right of such a line in the circumstances set out
    in rules 134(2), 134(3) and 139(2); (c) in the case of a dividing line that is 2 parallel continuous dividing lines, a
    driver may only drive to the right of such a line in the circumstances set out in rule 139(2) (as supplemented by rule
    139(3)).'
  text_en: 'The effect of this subrule, in relation to continuous dividing lines, is as follows: (a) in the case of a dividing
    line that is only a single continuous dividing line, or that is a broken dividing line to the right of a single continuous
    dividing line, a driver may only drive to the right of such a line in the circumstances set out in rule 134(3) and 139(2)
    (as supplemented by rule 139(3)); (b) in the case of a dividing line that is a single continuous dividing line to the
    right of a broken dividing line, a driver may only drive to the right of such a line in the circumstances set out in rules
    134(2), 134(3) and 139(2); (c) in the case of a dividing line that is 2 parallel continuous dividing lines, a driver may
    only drive to the right of such a line in the circumstances set out in rule 139(2) (as supplemented by rule 139(3)).'
