  source: Road Rules 2019 (Tas), current version
  section: 69(2)
  page: 30
  marking_type: give way line at intersection
  element: transverse
  text_original: Unless the driver is turning left using a slip lane, the driver must give way to a vehicle in, entering or
    approaching the intersection except – (a) an oncoming vehicle turning right at the intersection if a stop sign , stop
    line, give way sign or give way line applies to the driver of the oncoming vehicle; or (b) a vehicle turning left at the
    intersection using a slip lane; or (c) a vehicle making a U-turn.
