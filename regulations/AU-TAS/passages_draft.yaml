  page: 78
  marking_type: bus only lane
  element: lane_type
  text_original: A driver may drive across a bus only lane only if – (a) the driver is driving across the bus only lane to
    – (i) enter or leave a road; or (ii) enter a part of the road of one kind from a part of the road of another kind (for
    example, moving to or from a service road, the shoulder of the road or an emergency stopping lane); and (b) where the
    driver is approaching the bus only lane from the same direction as a vehicle in a bus only lane – the driver approaches
    the bus only lane from the lane nearest to the bus only lane; and (c) the driver gives way to any vehicles driving in
    the bus only lane.
