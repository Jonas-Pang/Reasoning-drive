  page: 91
  marking_type: emergency stopping lane
  element: lane_type
  text_original: A driver (except the rider of a bicycle) must not stop in an emergency stopping lane unless – (a) the condition
    of the driver, a passenger or the driver’s vehicle, or any other factor, makes it necessary or desirable for the driver
    to stop in the emergency stopping lane in the interests of safety, and the driver stops for no longer than is necessary
    in the circumstances; or (b) the driver is permitted to stop in the emergency stopping lane under another law of this
    jurisdiction.
  text_en: A driver (except the rider of a bicycle) must not stop in an emergency stopping lane unless – (a) the condition
    of the driver, a passenger or the driver’s vehicle, or any other factor, makes it necessary or desirable for the driver
    to stop in the emergency stopping lane in the interests of safety, and the driver stops for no longer than is necessary
    in the circumstances; or (b) the driver is permitted to stop in the emergency stopping lane under another law of this
    jurisdiction.
