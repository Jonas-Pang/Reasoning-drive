- rule_id: AU-TAS-150(1A)
  region: AU-TAS
  source: Road Rules 2019 (Tas), current version
  section: 150(1A)
  page: 74
  marking_type: continuous white edge line
  element: boundary
  text_original: A driver may drive on or over a continuous white edge line on a road if the driver is – (a) overtaking a
    vehicle that is turning right, or making a U-turn from the centre of the road, and is giving a right change of direction
    signal; or (b) driving a slow-moving vehicle, and it is necessary for the driver to drive on or over the edge line to
    allow the vehicle to be overtaken or passed by another vehicle; or (c) driving a vehicle that is too wide, or too long,
    to drive on the road without driving on or over the edge line; or (d) permitted to drive on or over the edge line under
    another law of this jurisdiction; or (e) avoiding an obstruction.
  text_en: A driver may drive on or over a continuous white edge line on a road if the driver is – (a) overtaking a vehicle
    that is turning right, or making a U-turn from the centre of the road, and is giving a right change of direction signal;
    or (b) driving a slow-moving vehicle, and it is necessary for the driver to drive on or over the edge line to allow the
    vehicle to be overtaken or passed by another vehicle; or (c) driving a vehicle that is too wide, or too long, to drive
    on the road without driving on or over the edge line; or (d) permitted to drive on or over the edge line under another
    law of this jurisdiction; or (e) avoiding an obstruction.
  text_en_is_translation: false
  norm: permissive
  actions_stated:
