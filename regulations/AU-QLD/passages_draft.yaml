- rule_id: AU-QLD-146(1)
  region: AU-QLD
  source: Transport Operations (Road Use Management—Road Rules) Regulation 2009 (Qld), current version
  section: 146(1)
  page: 161
  marking_type: marked lane
  element: lane_type
  text_original: 'A driver on a multi-lane road must drive so the driver’s vehicle is completely in a marked lane, unless
    the driver is—

    (a) entering a part of the road of 1 kind from a part of the road of another kind (for example, moving to or from a service
    road or a shoulder of the road); or

    (b) entering or leaving the road; or

    (c) moving from 1 marked lane to another marked lane; or

    (d) avoiding an obstruction; or

    (e) obeying a traffic control device applying to the marked lane; or

    (f) permitted to drive in more than 1 marked lane under this regulation; or

    (g) passing the rider of a bicycle or a personal mobility device that is travelling in the same direction as the driver
    and the driver’s vehicle is not completely in a marked lane in order to comply with section 144A(1) for the passing of
    the rider; or

    (h) lane filtering in compliance with section 151A; or

    (i) passing an emergency response vehicle under section 78A(2).'
  text_en: 'A driver on a multi-lane road must drive so the driver’s vehicle is completely in a marked lane, unless the driver
    is—

    (a) entering a part of the road of 1 kind from a part of the road of another kind (for example, moving to or from a service
    road or a shoulder of the road); or

    (b) entering or leaving the road; or

    (c) moving from 1 marked lane to another marked lane; or

    (d) avoiding an obstruction; or

    (e) obeying a traffic control device applying to the marked lane; or

    (f) permitted to drive in more than 1 marked lane under this regulation; or

    (g) passing the rider of a bicycle or a personal mobility device that is travelling in the same direction as the driver
    and the driver’s vehicle is not completely in a marked lane in order to comply with section 144A(1) for the passing of
    the rider; or

    (h) lane filtering in compliance with section 151A; or

    (i) passing an emergency response vehicle under section 78A(2).'
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-QLD-147(1)
  region: AU-QLD
  source: Transport Operations (Road Use Management—Road Rules) Regulation 2009 (Qld), current version
  section: 147(1)
  page: 163
  marking_type: continuous lane separation line
  element: boundary
  text_original: 'A driver on a multi-lane road must not move from 1 marked lane to another marked lane by crossing a continuous
    line separating the lanes unless—

    (a) the driver is avoiding an obstruction; or

    (b) the driver is obeying a traffic control device applying to the first marked lane; or

    (c) the driver is permitted to drive in both marked lanes under subsection (2); or

    (d) either of the marked lanes is a special purpose lane in which the driver is permitted to drive under this regulation
    and the driver is moving to or from the special purpose lane; or

    (e) either of the marked lanes is a special purpose lane during specified times only and the driver—

    (i) is moving to or from the lane when it is not a special purpose lane; and

    (ii) is permitted to drive in the lane when it is not a special purpose lane under this regulation; or'
  text_en: 'A driver on a multi-lane road must not move from 1 marked lane to another marked lane by crossing a continuous
    line separating the lanes unless—

    (a) the driver is avoiding an obstruction; or

    (b) the driver is obeying a traffic control device applying to the first marked lane; or

    (c) the driver is permitted to drive in both marked lanes under subsection (2); or

    (d) either of the marked lanes is a special purpose lane in which the driver is permitted to drive under this regulation
    and the driver is moving to or from the special purpose lane; or

    (e) either of the marked lanes is a special purpose lane during specified times only and the driver—

    (i) is moving to or from the lane when it is not a special purpose lane; and

    (ii) is permitted to drive in the lane when it is not a special purpose lane under this regulation; or'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
  verified_quote: true
  norm_check: agrees
- rule_id: AU-QLD-147(2)
  region: AU-QLD
  source: Transport Operations (Road Use Management—Road Rules) Regulation 2009 (Qld), current version
  section: 147(2)
  page: 164
  marking_type: continuous lane line
  element: boundary
  text_original: 'A driver on a multi-lane road may move from 1 marked lane to another marked lane by crossing a continuous
    line separating the lanes if—

    (a) the driver makes the move to approach or enter an intersection from the multi-lane road and section 28(2) or 32(2)
    applies to the driver for the purpose of making the move; or

    (b) the driver makes the move to approach or enter a roundabout from the multi-lane road and section 111(8) or (9) applies
    to the driver for the purpose of making the move; or

    (c) both of the following apply—

    (i) the driver is passing the rider of a bicycle or a personal mobility device that is travelling in the same direction
    as the driver and the movement is necessary to comply with section 144A(1) for the passing of the rider;

    (ii) the driver can perform the movement safely.'
  text_en: 'A driver on a multi-lane road may move from 1 marked lane to another marked lane by crossing a continuous line
    separating the lanes if—

    (a) the driver makes the move to approach or enter an intersection from the multi-lane road and section 28(2) or 32(2)
    applies to the driver for the purpose of making the move; or

    (b) the driver makes the move to approach or enter a roundabout from the multi-lane road and section 111(8) or (9) applies
    to the driver for the purpose of making the move; or

    (c) both of the following apply—

    (i) the driver is passing the rider of a bicycle or a personal mobility device that is travelling in the same direction
    as the driver and the movement is necessary to comply with section 144A(1) for the passing of the rider;

    (ii) the driver can perform the movement safely.'
  text_en_is_translation: false
