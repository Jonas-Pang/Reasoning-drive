- rule_id: AU-QLD-154A(2)
  region: AU-QLD
  source: Transport Operations (Road Use Management—Road Rules) Regulation 2009 (Qld), current version
  section: 154A(2)
  page: 175
  marking_type: bus only lane
  element: lane_type
  text_original: 'A driver may drive in a bus only lane if—

    (a) it is necessary for the driver to drive in the bus only lane to avoid an obstruction; and

    (b) the driver does not obstruct the path of a bus travelling in the bus only lane; and

    (c) if the driver is approaching the bus only lane from the same direction as vehicles travelling in the bus only lane—the
    driver approaches the bus only lane from the lane nearest to the bus only lane; and

    (d) the driver gives way to any vehicle travelling in the bus only lane; and

    (e) the driver is passing an emergency response vehicle under section 78A(2) or (4).'
  text_en: 'A driver may drive in a bus only lane if—

    (a) it is necessary for the driver to drive in the bus only lane to avoid an obstruction; and

    (b) the driver does not obstruct the path of a bus travelling in the bus only lane; and

    (c) if the driver is approaching the bus only lane from the same direction as vehicles travelling in the bus only lane—the
    driver approaches the bus only lane from the lane nearest to the bus only lane; and

    (d) the driver gives way to any vehicle travelling in the bus only lane; and

    (e) the driver is passing an emergency response vehicle under section 78A(2) or (4).'
  text_en_is_translation: false
