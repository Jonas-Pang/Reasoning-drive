- rule_id: AU-QLD-139A(2)
  region: AU-QLD
  source: Transport Operations (Road Use Management—Road Rules) Regulation 2009 (Qld), current version
  section: 139A(2)
  page: 155
  marking_type: dividing line
  element: boundary
  text_original: 'A driver on a road with a dividing line may drive to the right of the dividing line to pass the rider of
    a bicycle or a personal mobility device that is travelling in the same direction as the driver if—

    (a) the driver has a clear view of any approaching traffic; and

    (b) the driving is necessary to comply with section 144A(1) for the passing of the rider; and

    (c) the driver can do so safely.'
