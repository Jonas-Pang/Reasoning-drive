- rule_id: AU-QLD-65(1)–(2)
  region: AU-QLD
  source: Transport Operations (Road Use Management—Road Rules) Regulation 2009 (Qld), current version
  section: 65(1)–(2)
  page: 71
  marking_type: marked foot crossing with flashing yellow traffic light
  element: transverse
  text_original: '(1) This section applies to a driver approaching or at a marked foot crossing (except at or near an intersection)
    with a flashing yellow traffic light at the crossing.

    (2) The driver must—

    (a) give way to any pedestrian, or any rider of a bicycle or a personal mobility device, on or entering the crossing;
    and

    (b) not obstruct any pedestrian, or any rider of a bicycle or a personal mobility device, on the crossing; and

    (c) not overtake or pass a vehicle that is travelling in the same direction as the driver and is stopping, or has stopped,
    to give way at the crossing.'
  text_en: '(1) This section applies to a driver approaching or at a marked foot crossing (except at or near an intersection)
    with a flashing yellow traffic light at the crossing.

    (2) The driver must—

    (a) give way to any pedestrian, or any rider of a bicycle or a personal mobility device, on or entering the crossing;
    and

    (b) not obstruct any pedestrian, or any rider of a bicycle or a personal mobility device, on the crossing; and

    (c) not overtake or pass a vehicle that is travelling in the same direction as the driver and is stopping, or has stopped,
    to give way at the crossing.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
