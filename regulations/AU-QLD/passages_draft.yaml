  marking_type: continuous dividing lines
  element: boundary
  text_original: For subsection (2), if the dividing line is a single continuous dividing line to the left of a broken dividing
    line, a single continuous dividing line only or 2 parallel continuous dividing lines, the hazard in driving to the right
    of the dividing line must be taken into account in deciding whether it is reasonable to drive to the right of the dividing
    line.
  text_en: For subsection (2), if the dividing line is a single continuous dividing line to the left of a broken dividing
    line, a single continuous dividing line only or 2 parallel continuous dividing lines, the hazard in driving to the right
    of the dividing line must be taken into account in deciding whether it is reasonable to drive to the right of the dividing
    line.
