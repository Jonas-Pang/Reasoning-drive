- rule_id: AU-QLD-209(1)–(2)
  region: AU-QLD
  source: Transport Operations (Road Use Management—Road Rules) Regulation 2009 (Qld), current version
  section: 209(1)–(2)
  page: 229
  marking_type: parallel parking marking in median strip
  element: area
  text_original: '(1) This section applies to a driver who parks in a median strip parking area if a parking control sign
    or road marking applies to the area, and information on or with the sign or road marking indicates that the driver’s vehicle
    must be positioned parallel to the median strip.

    (2) The driver must position the driver’s vehicle—

    (a) to face—

    (i) in the direction of travel of vehicles in the marked lane or line of traffic to the left of the driver; or

    (ii) if there is no traffic to the left of the driver—in the direction in which vehicles ordinarily travel on the part
    of the road to the left of the driver; and

    (b) parallel, and as near as practicable, to the centre of the median strip; and

    (c) if the driver does not park in a parking bay—at least 1m from the closest point of any vehicle in front of it and
    any vehicle behind it.'
  text_en: '(1) This section applies to a driver who parks in a median strip parking area if a parking control sign or road
    marking applies to the area, and information on or with the sign or road marking indicates that the driver’s vehicle must
    be positioned parallel to the median strip.

    (2) The driver must position the driver’s vehicle—

    (a) to face—

    (i) in the direction of travel of vehicles in the marked lane or line of traffic to the left of the driver; or

    (ii) if there is no traffic to the left of the driver—in the direction in which vehicles ordinarily travel on the part
    of the road to the left of the driver; and

    (b) parallel, and as near as practicable, to the centre of the median strip; and

    (c) if the driver does not park in a parking bay—at least 1m from the closest point of any vehicle in front of it and
    any vehicle behind it.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
