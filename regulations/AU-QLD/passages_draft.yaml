  text_original: 'A driver must not drive in a bus only lane, unless the driver is—

    (a) a person permitted to drive on a busway under the Transport Infrastructure Act 1994, section 336; or

    (b) permitted to drive in the bus only lane under subsection (2).'
  text_en: 'A driver must not drive in a bus only lane, unless the driver is—

    (a) a person permitted to drive on a busway under the Transport Infrastructure Act 1994, section 336; or

    (b) permitted to drive in the bus only lane under subsection (2).'
