- rule_id: AU-QLD-134A(1)–(2)
  region: AU-QLD
  source: Transport Operations (Road Use Management—Road Rules) Regulation 2009 (Qld), current version
  section: 134A(1)–(2)
  page: 150
  marking_type: dividing line
  element: boundary
  text_original: 'This section applies to the driver of a long vehicle on a road with a dividing line.

    The driver may drive to the right of the dividing line if—

    (a) the driver is—

    (i) turning left from a single lane of a two-way road; or

    (ii) driving on a road that has a bend, including, for example, a bend that is designed for traffic calming; and

    (b) because of the width or condition of the road, or the bend, it is not practicable to drive to the left of the dividing
    line; and

    (c) the driver can do so safely.'
  text_en: 'This section applies to the driver of a long vehicle on a road with a dividing line.

    The driver may drive to the right of the dividing line if—

    (a) the driver is—

    (i) turning left from a single lane of a two-way road; or

    (ii) driving on a road that has a bend, including, for example, a bend that is designed for traffic calming; and

    (b) because of the width or condition of the road, or the bend, it is not practicable to drive to the left of the dividing
    line; and

    (c) the driver can do so safely.'
  text_en_is_translation: false
  norm: permissive
  actions_stated:
    cross_line: allowed
    turn_left: allowed
  verified_quote: true
  norm_check: agrees
