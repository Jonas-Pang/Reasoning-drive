    (a) in the case of a driver of a motor vehicle (other than a motorbike), is a reference to the first stop line that the
    driver comes, or came, to in approaching the lights; or

    (b) in the case of a rider of a bicycle, a personal mobility device or a motorbike, is a reference to the stop line that
    is nearest to the intersection.'
