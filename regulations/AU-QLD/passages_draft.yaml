- rule_id: AU-QLD-153(4)
  region: AU-QLD
  source: Transport Operations (Road Use Management—Road Rules) Regulation 2009 (Qld), current version
  section: 153(4)
  page: 173
  marking_type: bicycle lane start and end markings
  element: lane_type
  text_original: 'A bicycle lane is a marked lane, or the part of a marked lane—

    (a) beginning at a bicycle lane sign applying to the lane, or a road marking consisting of a white bicycle symbol and
    the word ‘lane’ painted in white; and

    (b) ending at the nearest of the following—

    (i) an end bicycle lane sign applying to the lane, or a road marking consisting of a white bicycle symbol and the words
    ‘end lane’ painted in white;

    (ii) an intersection (unless the lane is at the unbroken side of the continuing road at a T-intersection or continued
    across the intersection by broken lines);

    (iii) if the road ends at a dead end—the end of the road.'
  text_en: 'A bicycle lane is a marked lane, or the part of a marked lane—

    (a) beginning at a bicycle lane sign applying to the lane, or a road marking consisting of a white bicycle symbol and
    the word ‘lane’ painted in white; and

    (b) ending at the nearest of the following—

    (i) an end bicycle lane sign applying to the lane, or a road marking consisting of a white bicycle symbol and the words
    ‘end lane’ painted in white;

    (ii) an intersection (unless the lane is at the unbroken side of the continuing road at a T-intersection or continued
    across the intersection by broken lines);

    (iii) if the road ends at a dead end—the end of the road.'
