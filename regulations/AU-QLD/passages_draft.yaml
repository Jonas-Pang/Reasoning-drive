  marking_type: painted island at a merge or slip lane
  element: area
  text_original: 'Subsection (2)(a) does not apply in the case of a painted island—

    (a) that separates a road that takes vehicles in 1 direction from another road that takes vehicles in the same direction
    at a place where the roads merge; or

    (b) that separates 1 part of a road from other parts of the road to create a slip lane.'
