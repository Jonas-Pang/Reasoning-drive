    (i) a road and a railway meet at substantially the same level, whether or not there is a level crossing sign on the road
    at all or any of the entrances to the area; or

    (ii) a road and tram tracks meet at substantially the same level and that has a level crossing sign on the road at each
    entrance to the area; and

