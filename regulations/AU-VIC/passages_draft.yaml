- rule_id: AU-VIC-158(1)
  region: AU-VIC
  source: Road Safety Road Rules 2017 (Vic), authorised version 027 (27 Oct 2026)
  section: 158(1)
  page: 235
  marking_type: special purpose lanes
  element: lane_type
  text_original: 'The driver of any vehicle may drive for up to the permitted distance in a bicycle lane, bus lane, tram lane,
    transit lane or truck lane if it is necessary for the driver to drive in the lane—

    (a) to enter or leave the road; or

    (b) to turn at an intersection; or

    (c) to enter a part of the road of one kind from a part of the road of another kind (for example, moving to or from a
    service road, the shoulder of the road or an emergency stopping lane); or

    (d) to overtake a vehicle that is turning right, or making a U-turn from the centre of the road, and is giving a right
    change of direction signal; or

    (e) to enter a marked lane, or part of the road where there is room for a line of traffic (other than motor bikes, bicycles,
    electric scooters, motorised wheelchairs or animals), from the side of the road.'
  text_en: 'The driver of any vehicle may drive for up to the permitted distance in a bicycle lane, bus lane, tram lane, transit
    lane or truck lane if it is necessary for the driver to drive in the lane—

    (a) to enter or leave the road; or

    (b) to turn at an intersection; or

    (c) to enter a part of the road of one kind from a part of the road of another kind (for example, moving to or from a
    service road, the shoulder of the road or an emergency stopping lane); or

    (d) to overtake a vehicle that is turning right, or making a U-turn from the centre of the road, and is giving a right
    change of direction signal; or

    (e) to enter a marked lane, or part of the road where there is room for a line of traffic (other than motor bikes, bicycles,
    electric scooters, motorised wheelchairs or animals), from the side of the road.'
  text_en_is_translation: false
  norm: permissive
  actions_stated:
    go_straight: allowed
    turn_left: allowed
    turn_right: allowed
  verified_quote: true
  norm_check: agrees
