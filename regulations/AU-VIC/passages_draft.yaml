  region: AU-VIC
  source: Road Safety Road Rules 2017 (Vic), authorised version 027 (27 Oct 2026)
  section: Dictionary
  page: 590
  marking_type: marked lanes on a multi-lane road
  element: lane_type
  text_original: 'multi-lane road, for a driver, means a one-way road, or a two-way road, with 2 or more marked lanes (except
    bicycle lanes) that are—

    (a) on the side of the dividing line or median strip where the driver is driving; and

    (b) for the use of vehicles travelling in the same direction;'
  text_en: 'multi-lane road, for a driver, means a one-way road, or a two-way road, with 2 or more marked lanes (except bicycle
    lanes) that are—

    (a) on the side of the dividing line or median strip where the driver is driving; and

    (b) for the use of vehicles travelling in the same direction;'
  text_en_is_translation: false
