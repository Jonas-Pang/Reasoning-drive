- rule_id: AU-VIC-203B(2)
  region: AU-VIC
  source: Road Safety Road Rules 2017 (Vic), authorised version 027 (27 Oct 2026)
  section: 203B(2)
  page: 288
  marking_type: electric-powered vehicle symbol
  element: area
  text_original: 'A parking area for electric-powered vehicles is a length or area of a road—

    (a) to which a permissive parking sign displaying an electric-powered vehicle symbol applies; or

    (b) to which an electric-powered vehicle parking sign applies; or

    (c) indicated by a road marking that consists of, or includes, an electric-powered vehicle symbol.'
  text_en: 'A parking area for electric-powered vehicles is a length or area of a road—

    (a) to which a permissive parking sign displaying an electric-powered vehicle symbol applies; or

    (b) to which an electric-powered vehicle parking sign applies; or

    (c) indicated by a road marking that consists of, or includes, an electric-powered vehicle symbol.'
  text_en_is_translation: false
  norm: informative
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-VIC-247(1)
  region: AU-VIC
  source: Road Safety Road Rules 2017 (Vic), authorised version 027 (27 Oct 2026)
  section: 247(1)
  page: 370
  marking_type: bicycle lane
  element: lane_type
  text_original: The rider of a bicycle or an electric scooter riding on a length of road with a bicycle lane designed for
    bicycles and electric scooters travelling in the same direction as the rider must ride in the bicycle lane unless it is
    impracticable to do so.
  text_en: The rider of a bicycle or an electric scooter riding on a length of road with a bicycle lane designed for bicycles
    and electric scooters travelling in the same direction as the rider must ride in the bicycle lane unless it is impracticable
    to do so.
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-VIC-247A(1)
  region: AU-VIC
  source: Road Safety Road Rules 2017 (Vic), authorised version 027 (27 Oct 2026)
  section: 247A(1)
  page: 370
  marking_type: bicycle storage area
  element: area
  text_original: A rider of a bicycle or an electric scooter approaching a bicycle storage area at an intersection that has
    traffic lights or traffic arrows showing a red traffic light or red arrow must not enter the bicycle storage area other
    than from a bicycle lane, unless the rider is not required to ride in the bicycle lane under these Rules.
  text_en: A rider of a bicycle or an electric scooter approaching a bicycle storage area at an intersection that has traffic
    lights or traffic arrows showing a red traffic light or red arrow must not enter the bicycle storage area other than from
    a bicycle lane, unless the rider is not required to ride in the bicycle lane under these Rules.
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    enter_waiting_area: prohibited
  verified_quote: true
  norm_check: agrees
- rule_id: AU-VIC-281(a)
