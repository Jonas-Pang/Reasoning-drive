  norm_check: agrees
- rule_id: AU-VIC-352Example
  region: AU-VIC
  source: Road Safety Road Rules 2017 (Vic), authorised version 027 (27 Oct 2026)
  section: 352 Example
  page: 523
  marking_type: stop line
  element: transverse
  text_original: If a driver stops behind a vehicle that has stopped at a stop sign or stop line in accordance with rule 67,
    68 or 121, the driver must, after the vehicle has proceeded, stop at the stop sign or stop line in accordance with the
    rule.
