- rule_id: AU-VIC-35(4)
  region: AU-VIC
  source: Road Safety Road Rules 2017 (Vic), authorised version 027 (27 Oct 2026)
  section: 35(4)
  page: 57
  marking_type: bicycle hook turn storage area
  element: area
  text_original: 'To make a hook turn under this rule at an intersection that has a bicycle hook turn storage area on the
    left side of the intersection as the rider approaches the intersection, the rider must take the following initial 2 steps
    instead of the initial 2 steps listed in subrule (3):

    Step 1 Approach the intersection from the far left side of the road the rider is leaving and enter the intersection by
    moving into the bicycle hook turn storage area, keeping clear of any marked foot crossing.

    Step 2 Move forward in the bicycle hook turn storage area until the rider is as near as practicable to the far side of
    the road that the rider is entering.'
  text_en: 'To make a hook turn under this rule at an intersection that has a bicycle hook turn storage area on the left side
    of the intersection as the rider approaches the intersection, the rider must take the following initial 2 steps instead
    of the initial 2 steps listed in subrule (3):

    Step 1 Approach the intersection from the far left side of the road the rider is leaving and enter the intersection by
    moving into the bicycle hook turn storage area, keeping clear of any marked foot crossing.

    Step 2 Move forward in the bicycle hook turn storage area until the rider is as near as practicable to the far side of
    the road that the rider is entering.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    enter_waiting_area: allowed
  verified_quote: true
  norm_check: agrees
- rule_id: AU-VIC-56(1)
  region: AU-VIC
  source: Road Safety Road Rules 2017 (Vic), authorised version 027 (27 Oct 2026)
  section: 56(1)
  page: 73
  marking_type: stop line
  element: transverse
  text_original: 'A driver approaching or at traffic lights showing a red traffic light must stop—

    (a) if there is a stop line at or near the traffic lights—as near as practicable to, but before reaching, the stop line;
    or

    (b) if there is a stop here on red signal sign at or near the traffic lights, but no stop line—as near as practicable
    to, but before reaching, the sign; or

    (c) if there is no stop line or stop here on red signal sign at or near the traffic lights—as near as practicable to,
    but before reaching, the nearest or only traffic lights—

    and must not proceed past the stop line, stop here on red signal sign or nearest or only traffic lights (as the case may
    be) until the traffic lights show a green or flashing yellow traffic light or no traffic light.'
  text_en: 'A driver approaching or at traffic lights showing a red traffic light must stop—

    (a) if there is a stop line at or near the traffic lights—as near as practicable to, but before reaching, the stop line;
    or

    (b) if there is a stop here on red signal sign at or near the traffic lights, but no stop line—as near as practicable
    to, but before reaching, the sign; or

    (c) if there is no stop line or stop here on red signal sign at or near the traffic lights—as near as practicable to,
    but before reaching, the nearest or only traffic lights—

    and must not proceed past the stop line, stop here on red signal sign or nearest or only traffic lights (as the case may
    be) until the traffic lights show a green or flashing yellow traffic light or no traffic light.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
  verified_quote: true
  norm_check: agrees
