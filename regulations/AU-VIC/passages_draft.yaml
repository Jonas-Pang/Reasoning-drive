- rule_id: AU-VIC-147
  region: AU-VIC
  source: Road Safety Road Rules 2017 (Vic), authorised version 027 (27 Oct 2026)
  section: '147'
  page: 212
  marking_type: continuous lane line
  element: boundary
  text_original: 'A driver on a multi-lane road must not move from one marked lane to another marked lane by crossing a continuous
    line separating the lanes unless—

    (a) the driver is avoiding an obstruction; or

    (b) the driver is obeying a traffic control device applying to the first marked lane; or

    (c) the driver is permitted to drive in both marked lanes under another provision of these Rules; or

    (d) either of the marked lanes is a special purpose lane in which the driver is permitted to drive under these Rules and
    the driver is moving to or from the special purpose lane; or

    (e) either of the marked lanes is a special purpose lane during specified times only and the driver—

    (i) is moving to or from that lane outside of the times during which it is a special purpose lane; and

    (ii) is permitted to drive in that lane outside of the times during which it is a special purpose lane under these Rules;
    or

    (f) the rider of a motor cycle is engaging in lane filtering in the circumstances set out in rule 151B.'
  text_en: 'A driver on a multi-lane road must not move from one marked lane to another marked lane by crossing a continuous
    line separating the lanes unless—

    (a) the driver is avoiding an obstruction; or

    (b) the driver is obeying a traffic control device applying to the first marked lane; or

    (c) the driver is permitted to drive in both marked lanes under another provision of these Rules; or

    (d) either of the marked lanes is a special purpose lane in which the driver is permitted to drive under these Rules and
    the driver is moving to or from the special purpose lane; or

    (e) either of the marked lanes is a special purpose lane during specified times only and the driver—

    (i) is moving to or from that lane outside of the times during which it is a special purpose lane; and

    (ii) is permitted to drive in that lane outside of the times during which it is a special purpose lane under these Rules;
    or

    (f) the rider of a motor cycle is engaging in lane filtering in the circumstances set out in rule 151B.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
  verified_quote: true
  norm_check: agrees
