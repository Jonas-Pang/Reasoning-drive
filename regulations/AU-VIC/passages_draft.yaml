  marking_type: stop line at B lights
  element: transverse
  text_original: 'The driver of a public bus approaching or at B lights showing a red B light must stop—

    (a) if there is a stop line at or near the B lights—as near as practicable to, but before reaching, the stop line; or'
  text_en: 'The driver of a public bus approaching or at B lights showing a red B light must stop—

    (a) if there is a stop line at or near the B lights—as near as practicable to, but before reaching, the stop line; or'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
  verified_quote: true
  norm_check: agrees
