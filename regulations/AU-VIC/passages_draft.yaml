- rule_id: AU-VIC-138(2)
  region: AU-VIC
  source: Road Safety Road Rules 2017 (Vic), authorised version 027 (27 Oct 2026)
  section: 138(2)
  page: 198
  marking_type: single continuous line bordering a painted island
  element: area
  text_original: 'A driver may drive on or over a single continuous line along the side of or surrounding a painted island
    for up to 50 metres—

    (a) to enter or leave the road; or

    (b) to enter a turning lane that begins immediately after the painted island; or

    (c) to enter a part of the road of one kind from a part of the road of another kind (for example, moving to or from a
    service road or emergency stopping lane); or

    (d) to park in angle parking on the opposite side of the road provided that the driver does not need to perform a U-turn
    to reach the parking area.'
  text_en: 'A driver may drive on or over a single continuous line along the side of or surrounding a painted island for up
    to 50 metres—

    (a) to enter or leave the road; or

    (b) to enter a turning lane that begins immediately after the painted island; or

    (c) to enter a part of the road of one kind from a part of the road of another kind (for example, moving to or from a
    service road or emergency stopping lane); or

    (d) to park in angle parking on the opposite side of the road provided that the driver does not need to perform a U-turn
    to reach the parking area.'
  text_en_is_translation: false
