- rule_id: AU-VIC-187(1)
  region: AU-VIC
  source: Road Safety Road Rules 2017 (Vic), authorised version 027 (27 Oct 2026)
  section: 187(1)
  page: 269
  marking_type: bus, transit or truck lane
  element: lane_type
  text_original: 'A driver must not stop in a bus lane, transit lane or truck lane unless the driver—

    (a) is driving—

    (i) a commercial passenger vehicle while providing a commercial passenger vehicle service and is dropping off, or picking
    up, passengers; or

    (ii) a public bus or public minibus and is dropping off, or picking up, passengers; and

    (b) is permitted to drive in the lane under these Rules.'
  text_en: 'A driver must not stop in a bus lane, transit lane or truck lane unless the driver—

    (a) is driving—

    (i) a commercial passenger vehicle while providing a commercial passenger vehicle service and is dropping off, or picking
    up, passengers; or

    (ii) a public bus or public minibus and is dropping off, or picking up, passengers; and

    (b) is permitted to drive in the lane under these Rules.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-VIC-187(2)
