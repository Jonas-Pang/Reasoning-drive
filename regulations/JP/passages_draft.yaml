- rule_id: JP-附則８
  region: JP
  source: 道路標識、区画線及び道路標示に関する命令（昭和三十五年総理府・建設省令第三号）
  section: 附則 ８
  page: 2
  marking_type: Games-related vehicles exclusive lane
  element: lane_type
  text_original: 交通法第二十条第二項の道路標示により、車両通行帯の設けられた道路において、大会関係車両その他公安委員会が指定する自動車が通行しなければならない車両通行帯（以下この項において「大会関係車両等専用通行帯」という。）を指定し、かつ、他の車両（小型特殊自動車、原動機付自転車及び軽車両を除く。）が通行しなければならない車両通行帯として大会関係車両等専用通行帯以外の車両通行帯を指定すること。
  text_en: To designate, by road markings under Article 20, paragraph 2 of the Road Traffic Act, on roads provided with vehicular
    lanes, the vehicular lane in which Games-related vehicles and other motor vehicles designated by the Public Safety Commission
    must travel (hereinafter in this paragraph referred to as the “exclusive lane for Games-related vehicles, etc.”), and
    to designate lanes other than that exclusive lane as the vehicular lanes in which other vehicles (excluding small special
    motor vehicles, motorized bicycles and light vehicles) must travel.
  text_en_is_translation: true
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
