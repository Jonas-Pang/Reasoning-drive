# India (IN). The rule text is read into passages by the extractor; until it is accepted the country is listed
# but not used by any run until then:
#   python main.py regulations extract --pdf regulations/inbox/in_mv_driving_regulations_2017.pdf --code IN --name "India" --driving-side left --language en --title "The Motor Vehicles (Driving) Regulations, 2017 (G.S.R. 634(E))" --real
#   python main.py regulations accept IN
# Assessment 2026-11-17 (Claude, for the owner):
#   * Enough for the lane decisions: regulation 6 (lane traffic: dashed, solid, double solid, solid+dashed, painted
#     islands), 8 (turn arrows, U-turns across solid lines), 14(5)(c) (no overtaking across solid lines), 7/12/13
#     (stop lines), 22 (box, bus lane, kerb-side yellow). These are the driver's legal duties under section 118 of the
#     Motor Vehicles Act; the rule table needs nothing else.
#   * IRC:35-2015 (Code of Practice for Road Markings) is not used: it is the road authorities' design code, not the
#     driver's duties, and its copy carries a no-reproduction notice. It would only add descriptions (edge lines,
#     straight arrows, warning lines) that the rule table treats as conventions in every country anyway. Revisit if the
#     dev run shows India cells without a passage.
#   * Amendments: G.S.R. 586(E) (25.9.2020) changed only regulations 37 and 38 (navigation devices, e-documents).
#     A commercial database reports a 2024 amendment of regulations 8(1)(g), 8(3)(b) and 15(4); not found in the
#     Gazette yet. The table cites 8(1)(c), 8(2)(c) and 8(3)(a)(iv), not those clauses. Check the Gazette before the
#     India freeze.
#   * Source file: the Gazette of India pages of G.S.R. 634(E) as attached to Kerala Police circular 15/2018.

code: IN
name: India
name_zh: 印度
driving_side: left
status: in use                  # planned -> draft (extracted) -> in use (accepted)

standard:
  title: "The Motor Vehicles (Driving) Regulations, 2017 (G.S.R. 634(E))"
  language: en
  source_url: https://keralapolice.gov.in/storage/orders/iaps/cir-15-2018.pdf
  source_pdf: regulations/inbox/in_mv_driving_regulations_2017.pdf
  licence: "Government of India notification (Gazette of India)"

passages:
  marking: passages_lane.yaml
  lane: [passages_lane.yaml]

rule_tables:
  marking: action_rules.json
  lane: lane_action_rules.json
