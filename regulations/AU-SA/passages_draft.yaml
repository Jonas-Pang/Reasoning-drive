- rule_id: AU-SA-252(2)
  region: AU-SA
  source: Australian Road Rules (SA), current version
  section: 252(2)
  page: 245
  marking_type: no bicycles road marking
  element: lane_marking
  text_original: 'A no bicycles sign, or a no bicycles road marking, applies to a length of road or footpath beginning at
    the sign or marking and ending at the nearest of the following:

    (a) a bicycle path sign or bicycle path road marking;

    (b) a bicycle lane sign;

    (c) a separated footpath sign or separated footpath road marking;

    (d) a shared path sign;

    (e) an end no bicycles sign;

    (f) the next intersection.'
  text_en: 'A no bicycles sign, or a no bicycles road marking, applies to a length of road or footpath beginning at the sign
    or marking and ending at the nearest of the following:

    (a) a bicycle path sign or bicycle path road marking;

    (b) a bicycle lane sign;

    (c) a separated footpath sign or separated footpath road marking;

    (d) a shared path sign;

    (e) an end no bicycles sign;

    (f) the next intersection.'
  text_en_is_translation: false
  norm: informative
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
