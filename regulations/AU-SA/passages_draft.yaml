  marking_type: bicycle storage area
  element: area
  text_original: A rider of a bicycle approaching a bicycle storage area at an intersection that has traffic lights or traffic
    arrows showing a red traffic light or red traffic arrow must not enter the bicycle storage area other than from a bicycle
    lane, unless the rider is not required to ride in the bicycle lane under the Australian Road Rules.
  text_en: A rider of a bicycle approaching a bicycle storage area at an intersection that has traffic lights or traffic arrows
    showing a red traffic light or red traffic arrow must not enter the bicycle storage area other than from a bicycle lane,
