- rule_id: AU-SA-247B(1)
  region: AU-SA
  source: Australian Road Rules (SA), current version
  section: 247B(1)
  page: 242
  marking_type: bicycle storage area
  element: area
  text_original: 'A rider of a bicycle must when entering a bicycle storage area, give way to—

    (a) any vehicle that is in the area; and

    (b) if the area is before any green or yellow traffic lights, any motor vehicle that is entering or about to enter the
    area, unless the motor vehicle is turning in a direction that is subject to a red traffic arrow; and

    (c) if the area forms part of a lane to which traffic arrows apply, any motor vehicle that is entering or about to enter
    the area at a time when those arrows are green or yellow.'
  text_en: 'A rider of a bicycle must when entering a bicycle storage area, give way to—

    (a) any vehicle that is in the area; and

    (b) if the area is before any green or yellow traffic lights, any motor vehicle that is entering or about to enter the
    area, unless the motor vehicle is turning in a direction that is subject to a red traffic arrow; and

    (c) if the area forms part of a lane to which traffic arrows apply, any motor vehicle that is entering or about to enter
    the area at a time when those arrows are green or yellow.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
