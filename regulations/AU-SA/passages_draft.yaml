    (b) to enter a part of the road of one kind from a part of the road of another kind (for example, moving to or from a
    service road, the shoulder of the road or an emergency stopping lane); or

    (c) to overtake a vehicle that is turning right, or making a U-turn from the centre of the road, and is giving a right
