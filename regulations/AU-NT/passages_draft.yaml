- rule_id: AU-NT-65(1)–(2)
  region: AU-NT
  source: Traffic Regulations 1999 (NT), Australian Road Rules, current version
  section: 65(1)–(2)
  page: 68
  marking_type: marked foot crossing with flashing yellow traffic light
  element: transverse
  text_original: '(1) This rule applies to a driver approaching or at a marked foot crossing (except at or near an intersection)
    with a flashing yellow traffic light at the crossing.

    (2) The driver must:

    (a) give way to any pedestrian on or entering the crossing; and

    (b) not obstruct any pedestrian on the crossing; and

    (c) not overtake or pass a vehicle that is travelling in the same direction as the driver and is stopping, or has stopped,
    to give way at the crossing; and

    (d) give way to any bicycle rider on or entering the crossing.'
  text_en: '(1) This rule applies to a driver approaching or at a marked foot crossing (except at or near an intersection)
    with a flashing yellow traffic light at the crossing.

    (2) The driver must:

    (a) give way to any pedestrian on or entering the crossing; and

    (b) not obstruct any pedestrian on the crossing; and

    (c) not overtake or pass a vehicle that is travelling in the same direction as the driver and is stopping, or has stopped,
    to give way at the crossing; and

    (d) give way to any bicycle rider on or entering the crossing.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
