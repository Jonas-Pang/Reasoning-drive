- rule_id: AU-NT-(6)
  region: AU-NT
  source: Traffic Regulations 1999 (NT), Australian Road Rules, current version
  section: (6)
  page: 94
  marking_type: children's crossing markings
  element: transverse
  text_original: 'A children''s crossing is an area of a road:

    (a) at a place with stop lines marked on the road, and:

    (i) children crossing flags; or

    (ii) children''s crossing signs and twin yellow lights; and

    (b) indicated by:

    (i) 2 red and white posts erected on each side of the road; or

    (ii) 2 parallel continuous or broken lines on the road surface from one side of the road completely or partly across the
    road; and

    (c) extending across the road between the posts or lines.'
