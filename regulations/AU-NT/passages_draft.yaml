- rule_id: AU-NT-147(1)
  region: AU-NT
  source: Traffic Regulations 1999 (NT), Australian Road Rules, current version
  section: 147(1)
  page: 156
  marking_type: continuous lane line
  element: boundary
  text_original: 'A driver on a multi -lane road must not move from one marked lane to another marked lane by crossing a continuous
    line separating the lanes unless:

    (a) the driver is avoiding an obstruction; or

    (b) the driver is obeying a traffic control device applying to the first marked lane; or

    (c) the driver is permitted to drive in both marked lanes under another provision of the Australian Road Rules or under
    another law of this jurisdiction; or

    (d) either of the marked lanes is a special purpose lane in which the driver is permitted to drive under the Australian
    Road Rules and the driver is moving to or from the special purpose lane; or

    (e) either of the marked lanes is a special purpose lane during specified times only and the driver:

    (i) is moving to or from that lane outside of the times during which it is a special purpose lane; and

    (ii) is permitted to drive in that lane outside of the times during which it is a special purpose lane under the Australian
    Road Rules; or

    (f) the driver is lane filtering in accordance with rule 151A.'
  text_en: 'A driver on a multi -lane road must not move from one marked lane to another marked lane by crossing a continuous
    line separating the lanes unless:

    (a) the driver is avoiding an obstruction; or

    (b) the driver is obeying a traffic control device applying to the first marked lane; or

    (c) the driver is permitted to drive in both marked lanes under another provision of the Australian Road Rules or under
    another law of this jurisdiction; or

    (d) either of the marked lanes is a special purpose lane in which the driver is permitted to drive under the Australian
    Road Rules and the driver is moving to or from the special purpose lane; or

    (e) either of the marked lanes is a special purpose lane during specified times only and the driver:

    (i) is moving to or from that lane outside of the times during which it is a special purpose lane; and

    (ii) is permitted to drive in that lane outside of the times during which it is a special purpose lane under the Australian
    Road Rules; or

    (f) the driver is lane filtering in accordance with rule 151A.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
  verified_quote: true
  norm_check: agrees
