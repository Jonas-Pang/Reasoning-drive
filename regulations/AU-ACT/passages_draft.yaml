- rule_id: AU-ACT-32(2)
  region: AU-ACT
  source: Road Transport (Road Rules) Regulation 2017 (ACT), current republication
  section: 32 (2)
  page: 42
  marking_type: marked lane next to right lane
  element: lane_type
  text_original: 'A driver may approach and enter the intersection from the marked lane next to the right lane as well as,
    or instead of, the right lane if—

    (a) the driver’s vehicle, together with any load or projection, is 7.5m long, or longer; and

    (b) the vehicle displays a do not overtake turning vehicle sign; and

    (c) any part of the vehicle is within 50m of the nearest point of the intersection; and

    (d) it is not practicable for the driver to turn right from within the right lane; and

    (e) the driver can safely occupy the next marked lane and can safely turn right at the intersection by occupying the next
    marked lane, or both lanes.'
  text_en: 'A driver may approach and enter the intersection from the marked lane next to the right lane as well as, or instead
    of, the right lane if—

    (a) the driver’s vehicle, together with any load or projection, is 7.5m long, or longer; and

    (b) the vehicle displays a do not overtake turning vehicle sign; and

    (c) any part of the vehicle is within 50m of the nearest point of the intersection; and

    (d) it is not practicable for the driver to turn right from within the right lane; and

    (e) the driver can safely occupy the next marked lane and can safely turn right at the intersection by occupying the next
    marked lane, or both lanes.'
  text_en_is_translation: false
  norm: permissive
  actions_stated:
    turn_right: allowed
  verified_quote: true
  norm_check: agrees
