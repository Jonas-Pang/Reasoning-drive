- rule_id: AU-ACT-158(1)
  region: AU-ACT
  source: Road Transport (Road Rules) Regulation 2017 (ACT), current republication
  section: 158 (1)
  page: 174
  marking_type: special purpose lane
  element: lane_type
  text_original: 'The driver of any vehicle may drive for up to the permitted distance in a bicycle lane, bus lane, tram lane,
    transit lane or truck lane if it is necessary for the driver to drive in the lane—

    (a) to enter or leave the road; or

    (b) to enter a part of the road of 1 kind from a part of the road of another kind (for example, moving to or from a service
    road, the shoulder of the road or an emergency stopping lane); or

    (c) to overtake a vehicle that is turning right, or making a U-turn from the centre of the road, and is giving a right
    change of direction signal; or

    (d) to enter a marked lane, or part of the road where there is room for a line of traffic (other than motorbikes, bicycles,
    motorised wheelchairs or animals), from the side of the road.'
  text_en: 'The driver of any vehicle may drive for up to the permitted distance in a bicycle lane, bus lane, tram lane, transit
    lane or truck lane if it is necessary for the driver to drive in the lane—

    (a) to enter or leave the road; or

    (b) to enter a part of the road of 1 kind from a part of the road of another kind (for example, moving to or from a service
    road, the shoulder of the road or an emergency stopping lane); or

    (c) to overtake a vehicle that is turning right, or making a U-turn from the centre of the road, and is giving a right
    change of direction signal; or

    (d) to enter a marked lane, or part of the road where there is room for a line of traffic (other than motorbikes, bicycles,
    motorised wheelchairs or animals), from the side of the road.'
  text_en_is_translation: false
  norm: permissive
  actions_stated:
    go_straight: allowed
  verified_quote: true
  norm_check: agrees
