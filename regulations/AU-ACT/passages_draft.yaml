  source: Road Transport (Road Rules) Regulation 2017 (ACT), current republication
  section: 156 (1)
  page: 173
  marking_type: transit lane
  element: lane_type
  text_original: 'A driver must not drive in a transit lane unless—

    (a) the driver is driving—

    (i) a public bus, public minibus, motorbike, taxi, hire car or tram; or

    (ii) if the transit lane sign applying to the transit lane is a transit lane (T2) sign—a vehicle carrying at least 1 other
    person; or

    (iii) if the transit lane sign applying to the transit lane is a transit lane (T3) sign—a vehicle carrying at least 2
    other people; or

    (b) the driver is permitted to drive in the transit lane under section 158 (Exceptions to driving in special purpose lane
    etc).'
  text_en: 'A driver must not drive in a transit lane unless—

    (a) the driver is driving—

    (i) a public bus, public minibus, motorbike, taxi, hire car or tram; or

    (ii) if the transit lane sign applying to the transit lane is a transit lane (T2) sign—a vehicle carrying at least 1 other
    person; or

    (iii) if the transit lane sign applying to the transit lane is a transit lane (T3) sign—a vehicle carrying at least 2
    other people; or

    (b) the driver is permitted to drive in the transit lane under section 158 (Exceptions to driving in special purpose lane
    etc).'
  text_en_is_translation: false
