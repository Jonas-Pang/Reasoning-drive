- rule_id: AU-ACT-164C
  region: AU-ACT
  source: Road Transport (Road Rules) Regulation 2017 (ACT), current republication
  section: 164C
  page: 182
  marking_type: dividing lines, continuous lines, parallel lines and painted islands
  element: general
  text_original: '(1) The driver of a motor vehicle passing the rider of a bicycle that is travelling in the same direction
    as the driver may make a permitted manoeuvre to pass the rider if—

    (a) the driver has a clear view of any approaching traffic; and

    (b) the permitted manoeuvre is necessary to comply with section 164B; and

    (c) the driver can do so safely.

    (2) In this section:

    permitted manoeuvre means—

    (a) if the driver is driving on a two-way road without a dividing line or median strip—drive to the right of the centre
    of the road; or

    (b) if the driver is driving on a road with a dividing line —drive to the right of the dividing line; or

    (c) drive on a dividing strip that is at the same level as the road; or

    (d) drive on or over a single continuous line; or

    (e) drive on or over 2 parallel lines; or

    (f) drive along a side, or surrounding, of a painted island.'
  text_en: '(1) The driver of a motor vehicle passing the rider of a bicycle that is travelling in the same direction as the
    driver may make a permitted manoeuvre to pass the rider if—

    (a) the driver has a clear view of any approaching traffic; and

    (b) the permitted manoeuvre is necessary to comply with section 164B; and

    (c) the driver can do so safely.

    (2) In this section:

    permitted manoeuvre means—

    (a) if the driver is driving on a two-way road without a dividing line or median strip—drive to the right of the centre
    of the road; or

    (b) if the driver is driving on a road with a dividing line —drive to the right of the dividing line; or

    (c) drive on a dividing strip that is at the same level as the road; or

    (d) drive on or over a single continuous line; or

    (e) drive on or over 2 parallel lines; or

    (f) drive along a side, or surrounding, of a painted island.'
  text_en_is_translation: false
  norm: permissive
  actions_stated:
    cross_line: allowed
  verified_quote: true
  norm_check: agrees
