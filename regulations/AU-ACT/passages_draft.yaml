- rule_id: AU-ACT-159(1)
  region: AU-ACT
  source: Road Transport (Road Rules) Regulation 2017 (ACT), current republication
  section: 159 (1)
  page: 175
  marking_type: lane designated for a particular vehicle kind
  element: lane_type
  text_original: 'If information on or with a traffic sign applying to a length of road indicates that a vehicle of a particular
    kind must drive in a particular marked lane, a driver driving a vehicle of that kind on the length of road must drive
    in the indicated lane, unless the driver is—

    (a) avoiding an obstruction; or

    (b) obeying a traffic control device applying to the indicated lane; or

    (c) permitted to drive in the indicated lane and also another marked lane under another provision of this regulation;
    or

    (d) intending to turn off the road or to make a U-turn, and in order to do so safely without disrupting other vehicles
    on the road it is necessary to position the vehicle in another lane before starting the turn, or to make the turn.'
  text_en: 'If information on or with a traffic sign applying to a length of road indicates that a vehicle of a particular
    kind must drive in a particular marked lane, a driver driving a vehicle of that kind on the length of road must drive
    in the indicated lane, unless the driver is—

    (a) avoiding an obstruction; or

    (b) obeying a traffic control device applying to the indicated lane; or

    (c) permitted to drive in the indicated lane and also another marked lane under another provision of this regulation;
    or

    (d) intending to turn off the road or to make a U-turn, and in order to do so safely without disrupting other vehicles
    on the road it is necessary to position the vehicle in another lane before starting the turn, or to make the turn.'
  text_en_is_translation: false
