- rule_id: AU-ACT-35(4)
  region: AU-ACT
  source: Road Transport (Road Rules) Regulation 2017 (ACT), current republication
  section: 35 (4)
  page: 48
  marking_type: bicycle hook turn storage area
  element: area
  text_original: 'To make a hook turn under this section at an intersection that has a bicycle hook turn storage area on the
    left side of the intersection as the rider approaches the intersection, the rider must take the following initial 2 steps
    instead of the initial 2 steps listed in subsection (3):

    1 Approach the intersection from the far left side of the road the rider is leaving and enter the intersection by moving
    into the bicycle hook turn storage area, keeping clear of any marked foot crossing.

    2 Move forward in the bicycle hook turn storage area until the rider is as near as practicable to the far side of the
    road that the rider is entering.'
  text_en: 'To make a hook turn under this section at an intersection that has a bicycle hook turn storage area on the left
    side of the intersection as the rider approaches the intersection, the rider must take the following initial 2 steps instead
    of the initial 2 steps listed in subsection (3):

    1 Approach the intersection from the far left side of the road the rider is leaving and enter the intersection by moving
    into the bicycle hook turn storage area, keeping clear of any marked foot crossing.

    2 Move forward in the bicycle hook turn storage area until the rider is as near as practicable to the far side of the
    road that the rider is entering.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    enter_waiting_area: allowed
