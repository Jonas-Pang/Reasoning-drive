  text_original: 'The rider of a bicycle must, when entering a bicycle storage area, give way to—

    (a) any vehicle that is in the area; and

    (b) if the area is before any green or yellow traffic lights, any motor vehicle that is entering or about to enter the
    area, unless the motor vehicle is turning in a direction that is subject to a red traffic arrow; and

    (c) if the area forms part of a lane to which traffic arrows apply, any motor vehicle that is entering or about to enter
    the area at a time when those arrows are green or yellow.'
  text_en: 'The rider of a bicycle must, when entering a bicycle storage area, give way to—

    (a) any vehicle that is in the area; and

    (b) if the area is before any green or yellow traffic lights, any motor vehicle that is entering or about to enter the
    area, unless the motor vehicle is turning in a direction that is subject to a red traffic arrow; and

    (c) if the area forms part of a lane to which traffic arrows apply, any motor vehicle that is entering or about to enter
    the area at a time when those arrows are green or yellow.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
- rule_id: AU-ACT-274
  region: AU-ACT
  source: Road Transport (Road Rules) Regulation 2017 (ACT), current republication
  section: '274'
  page: 317
  marking_type: stop line
  element: transverse
  text_original: 'The driver of a tram approaching or at T lights showing a red T light must stop—

    (a) if there is a stop line at or near the T lights—as near as practicable to, but before reaching, the stop line; or

    (b) if there is no stop line at or near the T lights—as near as practicable to, but before reaching, the nearest or only
    T lights.'
  text_en: 'The driver of a tram approaching or at T lights showing a red T light must stop—

    (a) if there is a stop line at or near the T lights—as near as practicable to, but before reaching, the stop line; or

    (b) if there is no stop line at or near the T lights—as near as practicable to, but before reaching, the nearest or only
    T lights.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
