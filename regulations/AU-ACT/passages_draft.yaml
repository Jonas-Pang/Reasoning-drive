  page: 99
  marking_type: children’s crossing
  element: transverse
  text_original: 'If a driver stops at a children’s crossing for a hand-held stop sign, the driver must not proceed until
    there is no pedestrian or bicycle rider on or entering the crossing and the holder of the sign—

    (a) no longer displays the sign towards the driver; or

    (b) otherwise indicates that the driver may proceed.'
  text_en: 'If a driver stops at a children’s crossing for a hand-held stop sign, the driver must not proceed until there
    is no pedestrian or bicycle rider on or entering the crossing and the holder of the sign—

