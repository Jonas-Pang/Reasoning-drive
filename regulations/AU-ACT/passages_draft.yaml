  marking_type: bicycle lane start and end markings
  element: lane_type
  text_original: 'bicycle lane means a marked lane, or the part of a marked lane—

    (a) beginning at a bicycle lane sign applying to the lane, or a road marking comprising both a white bicycle symbol and
