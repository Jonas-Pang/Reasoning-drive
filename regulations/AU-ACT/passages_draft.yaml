- rule_id: AU-ACT-146(1)
  region: AU-ACT
  source: Road Transport (Road Rules) Regulation 2017 (ACT), current republication
  section: 146 (1)
  page: 157
  marking_type: marked lane
  element: lane_type
  text_original: 'A driver on a multi-lane road must drive so the driver’s vehicle is completely in a marked lane, unless
    the driver is—

    (a) entering a part of the road of 1 kind from a part of the road of another kind (for example, moving to or from a service
    road or a shoulder of the road); or

    (b) entering or leaving the road; or

    (c) moving from 1 marked lane to another marked lane; or

    (d) avoiding an obstruction; or

    (e) obeying a traffic control device applying to the marked lane; or

    (ea) lane filtering in accordance with section 151A; or

    (f) permitted to drive in more than 1 marked lane under another provision of this regulation.'
  text_en: 'A driver on a multi-lane road must drive so the driver’s vehicle is completely in a marked lane, unless the driver
    is—

    (a) entering a part of the road of 1 kind from a part of the road of another kind (for example, moving to or from a service
    road or a shoulder of the road); or

    (b) entering or leaving the road; or

    (c) moving from 1 marked lane to another marked lane; or

    (d) avoiding an obstruction; or

    (e) obeying a traffic control device applying to the marked lane; or

    (ea) lane filtering in accordance with section 151A; or

    (f) permitted to drive in more than 1 marked lane under another provision of this regulation.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated: {}
  verified_quote: true
