  page: 455
  marking_type: edge line
  element: boundary
  text_original: 'shoulder, of a road—

    (a) includes any part of the road that is not designed to be used by motor vehicles in travelling along the road, and
    includes—

    (i) for a kerbed road—any part of the kerb; and

    (ii) for a sealed road—any unsealed part of the road, and any sealed part of the road outside an edge line on the road;
    but

    (b) does not include a bicycle path, footpath or shared path.'
