- rule_id: AU-ACT-147
  region: AU-ACT
  source: Road Transport (Road Rules) Regulation 2017 (ACT), current republication
  section: '147'
  page: 158
  marking_type: continuous line separating lanes
  element: boundary
  text_original: 'A driver on a multi-lane road must not move from 1 marked lane to another marked lane by crossing a continuous
    line separating the lanes unless—

    (a) the driver is avoiding an obstruction; or

    (b) the driver is obeying a traffic control device applying to the first marked lane; or

    (c) the driver is permitted to drive in both marked lanes under another provision of this regulation; or

    (d) either of the marked lanes is a special purpose lane in which the driver is permitted to drive under this regulation
    and the driver is moving to or from the special purpose lane; or

    (e) either of the marked lanes is a special purpose lane during specified times only and the driver—

    (i) is moving to or from that lane outside of the times during which it is a special purpose lane; and

    (ii) is permitted to drive in that lane outside of the times during which it is a special purpose lane under this regulation;
    or

    (f) the driver is lane filtering in accordance with section 151A.'
  text_en: 'A driver on a multi-lane road must not move from 1 marked lane to another marked lane by crossing a continuous
    line separating the lanes unless—

    (a) the driver is avoiding an obstruction; or

    (b) the driver is obeying a traffic control device applying to the first marked lane; or

    (c) the driver is permitted to drive in both marked lanes under another provision of this regulation; or

    (d) either of the marked lanes is a special purpose lane in which the driver is permitted to drive under this regulation
    and the driver is moving to or from the special purpose lane; or

    (e) either of the marked lanes is a special purpose lane during specified times only and the driver—

    (i) is moving to or from that lane outside of the times during which it is a special purpose lane; and

    (ii) is permitted to drive in that lane outside of the times during which it is a special purpose lane under this regulation;
    or

    (f) the driver is lane filtering in accordance with section 151A.'
  text_en_is_translation: false
  norm: mandatory
  actions_stated:
    cross_line: prohibited
  verified_quote: true
  norm_check: agrees
