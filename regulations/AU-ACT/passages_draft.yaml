    lane from the marked lane, or line of traffic, immediately to the right of the turning lane; or

    (c) if the turning lane and painted island are nearest to the dividing line or median strip on the road or the far right
    side of the road—any vehicle entering the turning lane from the marked lane, or line of traffic, immediately to the left
    of the turning lane.'
