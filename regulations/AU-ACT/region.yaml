# the Australian Capital Territory, Australia (AU-ACT). Its road rules copy the Australian Road Rules (AU) with local changes: only pages that differ from the model law are read.
# Documents are downloaded and read by:
#   python main.py regulations fetch AU-ACT
#   python main.py regulations extract-all AU-ACT --real
#   python main.py regulations accept AU-ACT        (after reading passages_draft.yaml)

code: AU-ACT
name: "the Australian Capital Territory, Australia"
name_zh: "澳大利亚首都领地"
driving_side: left
parent: AU                      # takes AU's passages; its own passages (what it changed) override them by rule number
status: draft                   # planned -> draft (extracted) -> in use (accepted)

standard:
  title: "Road Transport (Road Rules) Regulation 2017 (ACT), current republication"
  language: en
  source_url: https://www.legislation.act.gov.au/sl/2017-43/current/pdf/2017-43.pdf
  source_pdf: regulations/inbox/AU-ACT/act_road_rules_regulation_2017
  licence: "not checked yet: see the register's copyright page"

documents:
  - tag: rules
    title: "Road Transport (Road Rules) Regulation 2017 (ACT), current republication"
    urls:
      - {url: "https://www.legislation.act.gov.au/sl/2017-43/current/pdf/2017-43.pdf", type: pdf}
    file: regulations/inbox/AU-ACT/act_road_rules_regulation_2017          # suffix (.pdf/.html/.rtf) = the type obtained
    keywords: ["dividing line", "lane line", "marked lane", "turn line", "traffic lane arrow", "lane arrow", "edge line", "painted island", "continuous line", "broken line", "keep clear", "stop line", "give way line", "hook turn", "transit lane", "bus lane", "tram lane", "truck lane", "bicycle lane", "special purpose lane", "changing lanes", "change lanes", "turning lane", "slip lane", "median strip", "line of traffic", "merge", "overtak", "keep left", "u-turn"]
    min_hits: 2
    same_as: AU:arr            # pages copied word for word from it are not sent

passages:
  marking: passages_lane.yaml
  lane: [passages_lane.yaml]

rule_tables:
  marking: action_rules.json
  lane: lane_action_rules.json
