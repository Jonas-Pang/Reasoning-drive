- rule_id: UK-TSRGD-10
  region: UK
  source: 'The Traffic Signs Regulations and General Directions 2016 (SI 2016/362), Schedule 9: road markings and their significance'
  document: tsrgd
  section: '10'
  page: 11
  marking_type: broken line beside continuous line
  element: boundary
  text_original: The warning conveyed to vehicular traffic on roads by the road marking is that no vehicle while travelling
    next to a broken line placed on the left of a continuous line, as viewed in the direction of travel of the vehicle, should
    cross or straddle the first-mentioned line unless it is seen by the driver of the vehicle to be safe to do so.
  text_en: The warning conveyed to vehicular traffic on roads by the road marking is that no vehicle while travelling next
    to a broken line placed on the left of a continuous line, as viewed in the direction of travel of the vehicle, should
    cross or straddle the first-mentioned line unless it is seen by the driver of the vehicle to be safe to do so.
