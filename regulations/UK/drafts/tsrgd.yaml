  page: 11
  marking_type: yellow box junction marking
  element: area
  text_original: Subject to sub-paragraphs (2), (3) and (4), the yellow criss-cross marking conveys the prohibition that a
    person must not cause a vehicle to enter the box junction so that the vehicle has to stop within the box junction due
    to the presence of stationary vehicles.
