- rule_id: UK-TSRGD-12(3)
  region: UK
  source: 'The Traffic Signs Regulations and General Directions 2016 (SI 2016/362), Schedule 9: road markings and their significance'
  document: tsrgd
  section: 12(3)
  page: 13
  marking_type: mandatory with-flow cycle lane boundary
  element: boundary
  text_original: 'Sub-paragraph (2) does not prohibit a vehicle from crossing into the part of the carriageway reserved for
    pedal cycles [ F18 and electric scooters being used in a trial ] , or straddling the marking, if it is safe and necessary
    to do so—

    (a) in order to pass a stationary vehicle;

    (b) to enable the vehicle to enter, from the side of the road on which it is proceeding, land or premises adjacent to
    the length of road on which the line is placed, or another road joining that road;

    (c) due to circumstances outside the control of the driver;

    (d) in order to avoid an accident; or

    (e) for the purpose of complying with any direction of a constable in uniform or a traffic warden.'
  text_en: 'Sub-paragraph (2) does not prohibit a vehicle from crossing into the part of the carriageway reserved for pedal
    cycles [ F18 and electric scooters being used in a trial ] , or straddling the marking, if it is safe and necessary to
    do so—

    (a) in order to pass a stationary vehicle;

    (b) to enable the vehicle to enter, from the side of the road on which it is proceeding, land or premises adjacent to
    the length of road on which the line is placed, or another road joining that road;

    (c) due to circumstances outside the control of the driver;

    (d) in order to avoid an accident; or

    (e) for the purpose of complying with any direction of a constable in uniform or a traffic warden.'
  text_en_is_translation: false
  norm: informative
  actions_stated:
    cross_line: allowed
  verified_quote: true
  norm_check: agrees
