  source: 'The Traffic Signs Regulations and General Directions 2016 (SI 2016/362), Schedule 9: road markings and their significance'
  document: tsrgd
  section: 12(2)
  page: 12
  marking_type: mandatory with-flow cycle lane
  element: lane_type
  text_original: Subject to sub-paragraphs (3) to (5), the marking conveys the requirement that a vehicle, other than a pedal
    cycle [ F17 or an electric scooter being used in a trial ] , must not be driven, or ridden, in the cycle lane during the
    cycle lane’s hours of operation (which may be all the time).
  text_en: Subject to sub-paragraphs (3) to (5), the marking conveys the requirement that a vehicle, other than a pedal cycle
    [ F17 or an electric scooter being used in a trial ] , must not be driven, or ridden, in the cycle lane during the cycle
    lane’s hours of operation (which may be all the time).
