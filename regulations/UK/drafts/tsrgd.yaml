- rule_id: UK-TSRGD-11(3)
  region: UK
  source: 'The Traffic Signs Regulations and General Directions 2016 (SI 2016/362), Schedule 9: road markings and their significance'
  document: tsrgd
  section: 11(3)
  page: 12
  marking_type: box junction
  element: area
  text_original: 'The prohibition in sub-paragraph (1) does not, in respect of a box junction within sub-paragraph (6)(a)
    of the definition of that expression, apply to a person who—

    (a) causes a vehicle to enter the box junction for the purpose of turning right; and

    (b) stops the vehicle within the box junction for so long as the vehicle is prevented from completing the right turn by
    an oncoming vehicle or other vehicle which is stationary whilst waiting to complete a right turn.'
  text_en: 'The prohibition in sub-paragraph (1) does not, in respect of a box junction within sub-paragraph (6)(a) of the
    definition of that expression, apply to a person who—

    (a) causes a vehicle to enter the box junction for the purpose of turning right; and

    (b) stops the vehicle within the box junction for so long as the vehicle is prevented from completing the right turn by
    an oncoming vehicle or other vehicle which is stationary whilst waiting to complete a right turn.'
  text_en_is_translation: false
  norm: informative
  actions_stated:
    turn_right: allowed
  verified_quote: true
  norm_check: agrees
- rule_id: UK-TSRGD-11(4)–(5)
  region: UK
  source: 'The Traffic Signs Regulations and General Directions 2016 (SI 2016/362), Schedule 9: road markings and their significance'
  document: tsrgd
  section: 11(4)–(5)
  page: 12
  marking_type: box junction
  element: area
  text_original: 'When a vehicle is being used for at least one of the purposes mentioned at sub-paragraph (5) and the observance
    of the prohibition in sub-paragraph (1) or (2) would be likely to hinder the use of that vehicle for that purpose, then
    that prohibition does not apply to the driver of the vehicle.

    The purposes are—

    (a) fire and rescue authority;

    (b) Scottish Fire and Rescue Service;

    (c) ambulance;

    (d) providing a response to an emergency at the request of an NHS ambulance service;

    (e) bomb or explosive disposal;

    (f) special forces;

    (g) police; and

    (h) National Crime Agency.'
  text_en: 'When a vehicle is being used for at least one of the purposes mentioned at sub-paragraph (5) and the observance
    of the prohibition in sub-paragraph (1) or (2) would be likely to hinder the use of that vehicle for that purpose, then
    that prohibition does not apply to the driver of the vehicle.

    The purposes are—

    (a) fire and rescue authority;

    (b) Scottish Fire and Rescue Service;

    (c) ambulance;

    (d) providing a response to an emergency at the request of an NHS ambulance service;

    (e) bomb or explosive disposal;

    (f) special forces;

    (g) police; and

    (h) National Crime Agency.'
  text_en_is_translation: false
  norm: informative
  actions_stated: {}
  verified_quote: true
  norm_check: agrees
