  region: UK
  source: The Highway Code (Great Britain), Road markings
  document: hc_markings
  section: ''
  page: 2
  marking_type: white parking bay markings
  element: area
  text_original: White bay markings and upright signs (see below) indicate where parking is allowed.
  text_en: White bay markings and upright signs (see below) indicate where parking is allowed.
