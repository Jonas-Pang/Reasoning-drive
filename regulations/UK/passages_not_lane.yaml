- rule_id: UK-HC_MARKINGS-p2-10
  region: UK
  source: The Highway Code (Great Britain), Road markings
  document: hc_markings
  section: ''
  page: 2
  marking_type: Red Route stopping box
  element: area
  text_original: On Red Routes you may stop to park, load/unload in specially marked boxes and adjacent signs specify the
    times and purposes and duration allowed.
  text_en: On Red Routes you may stop to park, load/unload in specially marked boxes and adjacent signs specify the times
    and purposes and duration allowed.
  text_en_is_translation: false
  norm: permissive
- rule_id: UK-HC_MARKINGS-p2-11
  region: UK
  source: The Highway Code (Great Britain), Road markings
  document: hc_markings
  section: ''
  page: 2
  marking_type: Red Route red box
  element: area
  text_original: A box MARKED IN RED indicates that it may only be available for the purpose specified for part of the day
    (eg between busy peak periods).
  text_en: A box MARKED IN RED indicates that it may only be available for the purpose specified for part of the day (eg between
    busy peak periods).
  text_en_is_translation: false
  norm: informative
