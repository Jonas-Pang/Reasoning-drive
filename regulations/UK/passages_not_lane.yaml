- rule_id: UK-HC_MARKINGS-p2-17
  region: UK
  source: The Highway Code (Great Britain), Road markings
  document: hc_markings
  section: ''
  page: 2
  marking_type: yellow loading restriction marks
  element: boundary
  text_original: Yellow marks on the kerb or at the edge of the carriageway indicate that loading or unloading is prohibited
    at the times shown on the nearby black and white plates. You may stop while passengers board or alight.
  text_en: Yellow marks on the kerb or at the edge of the carriageway indicate that loading or unloading is prohibited at
    the times shown on the nearby black and white plates. You may stop while passengers board or alight.
  text_en_is_translation: false
  norm: mandatory
