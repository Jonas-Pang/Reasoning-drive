# UK passages that are not lane rules (parking, loading, stopping bays), moved out of passages_lane.yaml on 2026-11-17.
# Not listed in region.yaml, so no run or labeling page uses them.

- rule_id: UK-HC_MARKINGS-p2-3
  region: UK
  source: The Highway Code (Great Britain), Road markings
  document: hc_markings
  section: ''
  page: 2
  marking_type: waiting restriction markings
  element: boundary
  text_original: The times at which the restrictions apply for other road markings are shown on nearby plates or on entry
    signs to controlled parking zones. If no days are shown on the signs, the restrictions are in force every day including
    Sundays and Bank Holidays.
  text_en: The times at which the restrictions apply for other road markings are shown on nearby plates or on entry signs
    to controlled parking zones. If no days are shown on the signs, the restrictions are in force every day including Sundays
    and Bank Holidays.
  text_en_is_translation: false
  norm: informative
