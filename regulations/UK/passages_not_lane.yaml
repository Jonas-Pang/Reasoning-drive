  marking_type: Loading Only bay
  element: area
  text_original: Lengths of road reserved for vehicles loading and unloading are indicated by a white ‘bay’ marking with the
    words ‘Loading Only’ and a sign with the white on blue ‘trolley’ symbol.
  text_en: Lengths of road reserved for vehicles loading and unloading are indicated by a white ‘bay’ marking with the words
