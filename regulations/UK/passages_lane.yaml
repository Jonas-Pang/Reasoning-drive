- rule_id: UK-TSRGD-7(d)
  region: UK
  source: 'The Traffic Signs Regulations and General Directions 2016 (SI 2016/362), Schedule 9: road markings and their significance'
  document: tsrgd
  section: 7(d)
  page: 9
  marking_type: cycle track give way lines
  element: transverse
  text_original: where the transverse lines are placed in advance of a length of the carriageway of the road where a cycle
    track crosses the road along a route parallel to the transverse lines, that no vehicle may proceed past such one of those
    lines as is the nearer the cycle track, in a manner or at a time likely to endanger any cyclist [ F7 , or driver of an
    electric scooter being used in a trial, ] proceeding along the cycle track or to cause such a cyclist [ F8 or driver ]
    to change speed or course in order to avoid an accident [ F9 ; and for the purposes of this paragraph a reference to “a
    cycle track” includes a reference to a way that would be a cycle track but for it being accessible, under a temporary
    statutory provision, by electric scooters being used in a trial ] .
  text_en: where the transverse lines are placed in advance of a length of the carriageway of the road where a cycle track
    crosses the road along a route parallel to the transverse lines, that no vehicle may proceed past such one of those lines
    as is the nearer the cycle track, in a manner or at a time likely to endanger any cyclist [ F7 , or driver of an electric
    scooter being used in a trial, ] proceeding along the cycle track or to cause such a cyclist [ F8 or driver ] to change
    speed or course in order to avoid an accident [ F9 ; and for the purposes of this paragraph a reference to “a cycle track”
    includes a reference to a way that would be a cycle track but for it being accessible, under a temporary statutory provision,
