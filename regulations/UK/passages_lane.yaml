- rule_id: UK-HC_MARKINGS-p2
  region: UK
  source: The Highway Code (Great Britain), Road markings
  document: hc_markings
  section: ''
  page: 2
  marking_type: yellow waiting restriction lines
  element: boundary
  text_original: Waiting restrictions indicated by yellow lines apply to the carriageway, pavement and verge. You may stop
    to load or unload (unless there are also loading restrictions as described below) or while passengers board or alight.
  text_en: Waiting restrictions indicated by yellow lines apply to the carriageway, pavement and verge. You may stop to load
    or unload (unless there are also loading restrictions as described below) or while passengers board or alight.
  text_en_is_translation: false
  norm: permissive
- rule_id: UK-HC_MARKINGS-p2-2
  region: UK
  source: The Highway Code (Great Britain), Road markings
  document: hc_markings
  section: ''
  page: 2
  marking_type: double yellow lines
  element: boundary
  text_original: Double yellow lines mean no waiting at any time, unless there are signs that specifically indicate seasonal
    restrictions.
  text_en: Double yellow lines mean no waiting at any time, unless there are signs that specifically indicate seasonal restrictions.
