- rule_id: UK-Rule191
  region: UK
  source: The Highway Code, Using the road (159 to 203), Pedestrian crossings (gov.uk)
  section: Rule 191
  page: ''
  marking_type: zig-zag lines at a pedestrian crossing
  element: boundary
  text_original: You MUST NOT park on a crossing or in the area covered by the zig-zag lines. You MUST NOT overtake the moving
    vehicle nearest the crossing or the vehicle nearest the crossing which has stopped to give way to pedestrians. Laws RTRA
    sect 25(5) & TSRGD schedule 14 parts 1 and 5
  text_en: You MUST NOT park on a crossing or in the area covered by the zig-zag lines. You MUST NOT overtake the moving vehicle
    nearest the crossing or the vehicle nearest the crossing which has stopped to give way to pedestrians. Laws RTRA sect 25(5)
    & TSRGD schedule 14 parts 1 and 5
  text_en_is_translation: false
  norm: mandatory
- rule_id: UK-KYTS-zigzag
  region: UK
  source: Know Your Traffic Signs (Department for Transport), pedestrian crossings
  section: zig-zag markings
  page: ''
  marking_type: zig-zag lines at a pedestrian crossing
  element: boundary
  text_original: The zig-zag markings at crossings are there to ensure that drivers and pedestrians can see each other clearly.
    As a driver, you must not park your vehicle anywhere within these markings (before or after the crossing). Also, you must
    not overtake a moving motor vehicle within the zig-zag area before the crossing, nor must you overtake a vehicle that has
    stopped next to the crossing either to obey signals or because pedestrians or cyclists are using a zebra or parallel crossing
    (see page 148).
  text_en: The zig-zag markings at crossings are there to ensure that drivers and pedestrians can see each other clearly. As a
    driver, you must not park your vehicle anywhere within these markings (before or after the crossing). Also, you must not
    overtake a moving motor vehicle within the zig-zag area before the crossing, nor must you overtake a vehicle that has stopped
    next to the crossing either to obey signals or because pedestrians or cyclists are using a zebra or parallel crossing (see
    page 148).
  text_en_is_translation: false
  norm: mandatory
