- rule_id: UK-TSRGD-10
  region: UK
  source: 'The Traffic Signs Regulations and General Directions 2016 (SI 2016/362), Schedule 9: road markings and their significance'
  document: tsrgd
  section: '10'
  page: 11
  marking_type: broken line beside continuous line
  element: boundary
  text_original: The warning conveyed to vehicular traffic on roads by the road marking is that no vehicle while travelling
    next to a broken line placed on the left of a continuous line, as viewed in the direction of travel of the vehicle, should
    cross or straddle the first-mentioned line unless it is seen by the driver of the vehicle to be safe to do so.
  text_en: The warning conveyed to vehicular traffic on roads by the road marking is that no vehicle while travelling next
    to a broken line placed on the left of a continuous line, as viewed in the direction of travel of the vehicle, should
    cross or straddle the first-mentioned line unless it is seen by the driver of the vehicle to be safe to do so.
  text_en_is_translation: false
  norm: recommended
- rule_id: UK-TSRGD-11(1)
  region: UK
  source: 'The Traffic Signs Regulations and General Directions 2016 (SI 2016/362), Schedule 9: road markings and their significance'
  document: tsrgd
  section: 11(1)
  page: 11
  marking_type: yellow box junction marking
  element: area
  text_original: Subject to sub-paragraphs (2), (3) and (4), the yellow criss-cross marking conveys the prohibition that a
    person must not cause a vehicle to enter the box junction so that the vehicle has to stop within the box junction due
    to the presence of stationary vehicles.
  text_en: Subject to sub-paragraphs (2), (3) and (4), the yellow criss-cross marking conveys the prohibition that a person
    must not cause a vehicle to enter the box junction so that the vehicle has to stop within the box junction due to the
    presence of stationary vehicles.
  text_en_is_translation: false
  norm: mandatory
- rule_id: UK-TSRGD-11(2)
  region: UK
  source: 'The Traffic Signs Regulations and General Directions 2016 (SI 2016/362), Schedule 9: road markings and their significance'
  document: tsrgd
  section: 11(2)
  page: 12
  marking_type: box junction
  element: area
  text_original: Subject to sub-paragraph (4) the marking when placed as a box junction within sub-paragraph (6)(c) of the
    definition of that expression conveys the prohibition that a person must not cause a vehicle to enter the box junction
    so that the vehicle has to stop within the box junction due to the presence of oncoming vehicles or other stationary vehicles
    beyond the box junction.
  text_en: Subject to sub-paragraph (4) the marking when placed as a box junction within sub-paragraph (6)(c) of the definition
    of that expression conveys the prohibition that a person must not cause a vehicle to enter the box junction so that the
    vehicle has to stop within the box junction due to the presence of oncoming vehicles or other stationary vehicles beyond
    the box junction.
  text_en_is_translation: false
  norm: mandatory
- rule_id: UK-TSRGD-11(3)
  region: UK
  source: 'The Traffic Signs Regulations and General Directions 2016 (SI 2016/362), Schedule 9: road markings and their significance'
  document: tsrgd
  section: 11(3)
  page: 12
  marking_type: box junction
  element: area
  text_original: 'The prohibition in sub-paragraph (1) does not, in respect of a box junction within sub-paragraph (6)(a)
    of the definition of that expression, apply to a person who—

    (a) causes a vehicle to enter the box junction for the purpose of turning right; and

    (b) stops the vehicle within the box junction for so long as the vehicle is prevented from completing the right turn by
    an oncoming vehicle or other vehicle which is stationary whilst waiting to complete a right turn.'
  text_en: 'The prohibition in sub-paragraph (1) does not, in respect of a box junction within sub-paragraph (6)(a) of the
    definition of that expression, apply to a person who—

    (a) causes a vehicle to enter the box junction for the purpose of turning right; and

    (b) stops the vehicle within the box junction for so long as the vehicle is prevented from completing the right turn by
    an oncoming vehicle or other vehicle which is stationary whilst waiting to complete a right turn.'
  text_en_is_translation: false
  norm: informative
- rule_id: UK-TSRGD-11(4)–(5)
  region: UK
  source: 'The Traffic Signs Regulations and General Directions 2016 (SI 2016/362), Schedule 9: road markings and their significance'
  document: tsrgd
  section: 11(4)–(5)
  page: 12
  marking_type: box junction
  element: area
  text_original: 'When a vehicle is being used for at least one of the purposes mentioned at sub-paragraph (5) and the observance
    of the prohibition in sub-paragraph (1) or (2) would be likely to hinder the use of that vehicle for that purpose, then
    that prohibition does not apply to the driver of the vehicle.

    The purposes are—

    (a) fire and rescue authority;

    (b) Scottish Fire and Rescue Service;

    (c) ambulance;

    (d) providing a response to an emergency at the request of an NHS ambulance service;

    (e) bomb or explosive disposal;

    (f) special forces;

    (g) police; and

    (h) National Crime Agency.'
  text_en: 'When a vehicle is being used for at least one of the purposes mentioned at sub-paragraph (5) and the observance
    of the prohibition in sub-paragraph (1) or (2) would be likely to hinder the use of that vehicle for that purpose, then
    that prohibition does not apply to the driver of the vehicle.

    The purposes are—

    (a) fire and rescue authority;

    (b) Scottish Fire and Rescue Service;

    (c) ambulance;

    (d) providing a response to an emergency at the request of an NHS ambulance service;

    (e) bomb or explosive disposal;

    (f) special forces;

    (g) police; and

    (h) National Crime Agency.'
  text_en_is_translation: false
  norm: informative
- rule_id: UK-TSRGD-11(7)
  region: UK
  source: 'The Traffic Signs Regulations and General Directions 2016 (SI 2016/362), Schedule 9: road markings and their significance'
  document: tsrgd
  section: 11(7)
  page: 12
  marking_type: box junction
  element: area
  text_original: A reference in this paragraph (however expressed) to a vehicle which is stationary or stops within a box
    junction includes a vehicle which is stationary whilst part of it is within the box junction.
  text_en: A reference in this paragraph (however expressed) to a vehicle which is stationary or stops within a box junction
    includes a vehicle which is stationary whilst part of it is within the box junction.
  text_en_is_translation: false
  norm: informative
- rule_id: UK-TSRGD-12(2)
  region: UK
  source: 'The Traffic Signs Regulations and General Directions 2016 (SI 2016/362), Schedule 9: road markings and their significance'
  document: tsrgd
  section: 12(2)
  page: 12
  marking_type: mandatory with-flow cycle lane
  element: lane_type
  text_original: Subject to sub-paragraphs (3) to (5), the marking conveys the requirement that a vehicle, other than a pedal
    cycle [ F17 or an electric scooter being used in a trial ] , must not be driven, or ridden, in the cycle lane during the
    cycle lane’s hours of operation (which may be all the time).
  text_en: Subject to sub-paragraphs (3) to (5), the marking conveys the requirement that a vehicle, other than a pedal cycle
    [ F17 or an electric scooter being used in a trial ] , must not be driven, or ridden, in the cycle lane during the cycle
    lane’s hours of operation (which may be all the time).
  text_en_is_translation: false
  norm: mandatory
- rule_id: UK-TSRGD-12(3)
  region: UK
  source: 'The Traffic Signs Regulations and General Directions 2016 (SI 2016/362), Schedule 9: road markings and their significance'
  document: tsrgd
  section: 12(3)
  page: 13
  marking_type: mandatory with-flow cycle lane boundary
  element: boundary
  text_original: 'Sub-paragraph (2) does not prohibit a vehicle from crossing into the part of the carriageway reserved for
    pedal cycles [ F18 and electric scooters being used in a trial ] , or straddling the marking, if it is safe and necessary
    to do so—

    (a) in order to pass a stationary vehicle;

    (b) to enable the vehicle to enter, from the side of the road on which it is proceeding, land or premises adjacent to
    the length of road on which the line is placed, or another road joining that road;

    (c) due to circumstances outside the control of the driver;

    (d) in order to avoid an accident; or

    (e) for the purpose of complying with any direction of a constable in uniform or a traffic warden.'
  text_en: 'Sub-paragraph (2) does not prohibit a vehicle from crossing into the part of the carriageway reserved for pedal
    cycles [ F18 and electric scooters being used in a trial ] , or straddling the marking, if it is safe and necessary to
    do so—

    (a) in order to pass a stationary vehicle;

    (b) to enable the vehicle to enter, from the side of the road on which it is proceeding, land or premises adjacent to
    the length of road on which the line is placed, or another road joining that road;

    (c) due to circumstances outside the control of the driver;

    (d) in order to avoid an accident; or

    (e) for the purpose of complying with any direction of a constable in uniform or a traffic warden.'
  text_en_is_translation: false
  norm: informative
