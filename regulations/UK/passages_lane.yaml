  text_original: Diagram 1010 (a) edge of the carriageway at a road junction or a lay-by, or at an exit from a private drive
    onto a public road; (b) the start of a traffic lane, the boundary of which is indicated by the road marking shown at item
    11 of the table in Part 6 of Schedule 9; (c) when used in conjunction with the road marking at item 4 of the sign table
    in Part 4 of Schedule 2, the most suitable path to be taken by high vehicles under a low bridge or to avoid an overhanging
    structure; (d) when laid alongside rails used by tramcars, the edge of the part of the carriageway used by the tramcars;
    (e) the division between the main carriageway and a traffic lane which leaves the main carriageway at a junction ahead;
    (f) the boundary between the main carriageway and either a diverging or merging traffic lane at a road junction; (g) the
    boundary between an emergency refuge area and either an actively managed hard shoulder or the edge of carriageway of a
    motorway; or (h) the division between the main carriageway and a cycle lane through a junction (Longitudinal marking)
