- rule_id: UK-HC_MARKINGS-p2-8
  region: UK
  source: The Highway Code (Great Britain), Road markings
  document: hc_markings
  section: ''
  page: 2
  marking_type: Red Route red lines
  element: boundary
  text_original: The double and single red lines used on Red Routes indicate that stopping to park, load/unload or to board
    and alight from a vehicle (except for a licensed taxi or if you hold a Blue Badge) is prohibited. The red lines apply
    to the carriageway, pavement and verge.
  text_en: The double and single red lines used on Red Routes indicate that stopping to park, load/unload or to board and
    alight from a vehicle (except for a licensed taxi or if you hold a Blue Badge) is prohibited. The red lines apply to the
    carriageway, pavement and verge.
  text_en_is_translation: false
  norm: mandatory
