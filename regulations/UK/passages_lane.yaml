- rule_id: UK-TSRGD-3
  region: UK
  source: 'The Traffic Signs Regulations and General Directions 2016 (SI 2016/362), Schedule 9: road markings and their significance'
  document: tsrgd
  section: '3'
  page: 7
  marking_type: give way line
  element: transverse
  text_original: Subject to paragraph 4, the requirements conveyed to vehicular traffic on roads by a give way sign are that
    no vehicle is to cross the transverse line nearer to the major road at the side of which that line is placed, or if that
    line is not clearly visible, enter that major road, so as to be likely to endanger any person, or to cause the driver
    of another vehicle to change its speed or course in order to avoid an accident.
  text_en: Subject to paragraph 4, the requirements conveyed to vehicular traffic on roads by a give way sign are that no
    vehicle is to cross the transverse line nearer to the major road at the side of which that line is placed, or if that
    line is not clearly visible, enter that major road, so as to be likely to endanger any person, or to cause the driver
    of another vehicle to change its speed or course in order to avoid an accident.
  text_en_is_translation: false
  norm: mandatory
- rule_id: UK-TSRGD-4
  region: UK
  source: 'The Traffic Signs Regulations and General Directions 2016 (SI 2016/362), Schedule 9: road markings and their significance'
  document: tsrgd
  section: '4'
  page: 7
  marking_type: level crossing give way line
  element: transverse
  text_original: The requirements conveyed to vehicular traffic on roads by a give way sign when placed in combination with
    the sign are that no vehicle must cross the transverse line nearer to the level crossing at the side of which that line
    is placed, or if that line is not clearly visible, enter that level crossing, so as to be likely to endanger the driver
    of, or any passenger in, any railway vehicle or tramcar or to cause that driver to change the speed of his or her vehicle
    in order to avoid an accident.
  text_en: The requirements conveyed to vehicular traffic on roads by a give way sign when placed in combination with the
    sign are that no vehicle must cross the transverse line nearer to the level crossing at the side of which that line is
    placed, or if that line is not clearly visible, enter that level crossing, so as to be likely to endanger the driver of,
    or any passenger in, any railway vehicle or tramcar or to cause that driver to change the speed of his or her vehicle
    in order to avoid an accident.
  text_en_is_translation: false
  norm: mandatory
