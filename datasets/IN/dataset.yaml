# Images and labels of India (see datasets/US/dataset.yaml for the fields). The image sources are the ones
# GeoDrive-Bench uses for this country; download them from their pages (each has its own terms), then:
#   python main.py label --data <root>/idd images init idd --source <the unpacked dataset>

region: IN
collections:
  - name: idd
    kind: images
    reader: folder              # any folder of images; the frames of one sub-folder form one clip
    dataset_name: IDD
    source: "India Driving Dataset (IIIT Hyderabad), IDD Multimodal primary set; research use after registration"
    download: https://idd.insaan.iiit.ac.in/
    default_source: data/extracted/idd_multimodal
    candidates: datasets/IN/candidates_geodrive.csv   # frames with lane markings in GeoDrive-Bench (label geodrive)
    access: registration
    access_note: "register at https://idd.insaan.iiit.ac.in/ and download IDD Multimodal (primary, leftCamImgs) yourself; then point --source at it"

split:
  rule: 'sha1("6216:" + clip) mod 10 = 0 -> dev, else test'
  per_marking_type: {dev: 6, test: 30}
  degraded_test: 30
